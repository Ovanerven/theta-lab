# Base config for the Mac-mini M4 sweep (run via run_m4_mac_sweep.sh).
# EXACT match to the current multi-seed baseline
#   experiments_final/FINAL_coarse_nngru_finalize/NG_plain_s{0,1,2,3}
# so the l2pen / rk4resid conditions are directly comparable to those baseline
# runs (only the toggled flag differs). The launcher overrides study/exp_name/
# out_root/seed and the per-condition flags.
dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
epochs: 200
batch_size: 100
lr: 0.002
weight_decay: 0.0018
warmup_epochs: 5
cosine_decay: false
val_n: 125
test_n: 125
train_n: 0
val_frac: 0.0
seed: 0
split_seed: 42
stratified_split: true
stratify_bins: 5
stratify_targets:
- 3
- 5
stratify_z_expr: false
test_real_only: false
use_synthetic_data: false
num_workers: 0
pin_memory: true
scaffold: txtl_model4_three_state
model_class: ode_rnn
hidden: 300
lift_dim: 32
num_layers: 2
dropout: 0.2
theta_lo: 1.0e-06
theta_hi: 2.0
n_substeps: 3
ff_mult: 2
context_len: 64
tf_group_size: 32
ar_gap: 4
nn_hidden: 256
nn_layers: 2
slstm_drop_last_layer: true
use_basal: false
theta_bounded: true
lift_skip: true
gru_variant: nn_gru
gru_init: supervisor
head_init: supervisor
y0_theta_init: false
encoder_use_time: false
encoder_use_log_dt: true
theta_head_transform: log_gamma
theta_head_tau: 2.3
u_transform: pulse_cumsum_sqrt
y_transform: sqrt_clamp1
grad_clip: 1.0
teacher_forcing: true
tf_every: 200
tf_drop_epoch: 100
ckpt_every: 0
endpoint_r2: true
# --- regularization (idea #3: theta-smoothness L2; toggled per-condition) ---
l1_regularization: false
l2_regularization: false
lambda_reg: 0.001
# --- idea #1: stage-evaluated neural residual g(y) (toggled per-condition) ---
rk4_residual: false
rk4_residual_hidden: 64
rk4_residual_layers: 2
obs_idx:
- 3
- 5
gru_y_cols:
- 3
- 5
gru_u_cols:
- 0
- 1
- 3
- 4
- 5
- 6
- 7
- 8
- 9
- 10
- 11
supervise_endpoints_only: false
wandb_enabled: false
jit_scripting: true
torch_compile: false
autocast_bf16: false
model_class: ode_rnn
obs_normalization: null
subtract_channel_min: true
subtract_channel_min_cols:
- 3
- 5
stratify_by_source: true
source_loss_weights:
  new: 1.0
  old: 1.0
balance_source_sampler: false
plot_extra_new_samples: 0
lambda_zero_traj: 0.0
species_weights: null
time_upweight: null
lambda_endpoint: 0.0
endpoint_channels: null
endpoint_loss_space: log
lambda_peak: 0.0
peak_channels: null
loss_normalizer_channels: 3
loss_clamp_min: 1.0
