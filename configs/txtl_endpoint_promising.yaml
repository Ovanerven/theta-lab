# Most promising arm from txtl_init_loss_tf_sweep_rerun.
#
# Best balanced endpoint R² result from the rerun sweep:
#   rerun/endpoint_1 → Rp=-0.196, Rm=-0.099, test_loss=0.518
#
# Knobs that mattered:
#   - lambda_endpoint=1.0  (vs 5.0 which collapses Rp to ~-0.6)
#   - obs_normalization=log1p_clip1
#   - tf_drop_epoch=25, tf_every=50
#   - hidden=256, num_layers=2, dropout=0.1
#
# Note on u_transform: the rerun used `cumsum_sqrt` on u. Per current
# diagnosis, cumsum on u is suspect (only DNA c benefits from cumulative
# accumulation, and DNA c is already routed through the ODE state). Two
# follow-up arms in txtl_supervisor_match_sweep test `sqrt` and `minmax_sqrt`.

study: txtl_endpoint_promising
exp_name: endpoint_1
out_root: experiments

dataset_path: datasets/real_ivtt_raw_no_outliers.npz
scaffold: txtl_resource_and_maturation_dna
model_class: ode_rnn_txtl

epochs: 50
batch_size: 32
val_n: 64
test_n: 64
seed: 1
split_seed: 42

stratified_split: true
stratify_bins: 5
stratify_targets: [3, 5]
obs_idx: [3, 5]

hidden: 256
lift_dim: 32
num_layers: 2
dropout: 0.1
grad_clip: 1.0
lr: 0.001
weight_decay: 0.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 25

u_transform: cumsum_sqrt
y_transform: sqrt
gru_y_obs_only: true
exclude_ode_cols_from_gru: true
detach_y_prev: true
head_bias_init: 0.0
head_weight_gain: 1.0

loss_type: mse
obs_normalization: log1p_clip1
auto_scale_aux_losses: true

lambda_endpoint: 1.0
lambda_pm_tail: 0.5
pm_tail_frac: 0.5

lambda_r_terminal: 0.00001
r_terminal_frac: 0.05
lambda_o_terminal: 0
o_terminal_frac: 0.05

theta_lo: 1.0e-6
theta_hi: 1.0
theta_lo_vec: [1.0e-6, 1.0e-6, 1.0e-7, 1.0e-5, 1.0e-7, 1.0e-5, 5.0e-5]
theta_hi_vec: [5.0e-4, 5.0e-4, 1.2e-1, 1.0e-2, 8.0e-2, 3.5e-4, 3.5e-3]
n_substeps: 1

ckpt_every: 10
jit_scripting: false
torch_compile: true
endpoint_r2: true
