# Config for BobGRUVerbatim model using bob_model hyperparams.
# IMPORTANT: bob_model runs shown in bob_model/main_neural_spline.py construct
# NeuralSpline(..., rescale_inputs=False), i.e. *no* MinMax scaling on reagents.
# Generate the matching dataset with (EXACT bob_model semantics):
#   python datasets/convert_real_to_npz.py --layout full --reagent-scaling none --dna-mode raw --obs-align current --output datasets/real_ivtt_bob_exact_full.npz

dataset_path: datasets/real_ivtt_bob_exact_full.npz
study: bob_gru_verbatim
tags: null
exp_name: default
out_root: experiments

save_model_name: model.pt
save_last_name: model_last.pt
save_curves_name: loss_curves.npz

# Training hyperparameters (from bob_model/main_neural_spline.py active loop)
epochs: 250
batch_size: 100
lr: 0.002
weight_decay: 0.0018
warmup_epochs: 0
cosine_decay: false

# Train/val/test split
val_n: 0
test_n: 0
val_frac: 0.0
seed: 42
split_seed: 42

# Match bob_model/neural_spline.py make_train_test_split(): seed=57, 12.5% test, 12.5% val
use_bob_split: true
bob_split_seed: 57
bob_test_frac: 0.125
bob_val_frac: 0.125

# Use one of the three hardcoded (test, val, train) triples from
# bob_model/3 seed splits.py. Takes precedence over use_bob_split when set.
bob_seed_split_file: "bob_model/3 seed splits.py"
bob_seed_split_idx: 0  # 0, 1, or 2

# Optional stratification by endpoint outcomes
stratified_split: false
stratify_bins: 5
stratify_targets: null

num_workers: 0
pin_memory: true

# Model selection
model_class: bob_gru_verbatim

# Model architecture (matching bob_model defaults for GRU_model_latent_decay_simple_fb_matO)
# Note: scaffold is unused by BobGRUVerbatim (hardcoded to 7-state IVTT) but the
# plot scripts still look it up — match the npz layout to avoid KeyError.
scaffold: txtl_resource_and_maturation_dna
hidden: 400
lift_dim: 32
num_layers: 2
dropout: 0.2
theta_lo: 1.0e-06
theta_hi: 2.0
n_substeps: 1

# Loss: bob_model trains with log1p-space MSE on clamped values.
# In train.py we enable the Bob-exact loss path.
obs_normalization: null

# bob_model compatibility
use_bob_loss: true

# Match bob_model teacher forcing schedule (on until epoch 99; off from epoch 100)
teacher_forcing: true
tf_every: 200
tf_drop_epoch: 100
grad_clip: 1.0

# Match bob_model/neural_spline.py:1760: model = torch.jit.script(model)
jit_scripting: true
