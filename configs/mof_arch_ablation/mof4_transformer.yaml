dataset_path: datasets/mof_synthesis_4.npz
exp_name: mof4_transformer

epochs: 50
batch_size: 32        # smaller than GRU: O(K * context_len^2 * B) memory
lr: 0.0001
weight_decay: 0.0085
warmup_epochs: 10
val_n: 100
test_n: 100
seed: 42

hidden: 128
lift_dim: 32
num_layers: 2         # transformer depth (GRU uses 1 layer)
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 500

scaffold: mof_synthesis_4
theta_lo: 1.0e-3
theta_hi: 2.0
n_substeps: 1

study: mof_arch_ablation
ckpt_every: 10
jit_scripting: false   # TransformerEncoder is not scriptable
model_class: ode_transformer
