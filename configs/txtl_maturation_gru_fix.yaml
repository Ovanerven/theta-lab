# Real IVTT data, full 7-state TXTL maturation scaffold.
#
# Key changes vs txtl_maturation_gru.yaml — all targeting the "mean-trajectory
# collapse" diagnosed in experiments/real_ivtt_test/20260425_*. Without these,
# `diagnose_collapse.py` shows that pred-pm-final and pred-mm-peak are nearly
# identical across all val trajectories, and theta CV is < 7% per parameter.
#
#   1. y_transform: sqrt
#        Without it, pm values up to ~8000 dominate the lift layer over reagent
#        cumsum values (~1). The GRU stops responding to its inputs and
#        converges to a constant theta. sqrt(pm) caps that at ~90; reagents are
#        unchanged. log1p is also fine.
#   2. gru_y_obs_only: true
#        Restricts GRU's y feedback to {mm, pm} instead of all 7 states. The
#        latent states (R, O, m, p, DNA) are model fabrications during
#        open-loop rollout and provide no useful conditioning signal. Matches
#        supervisor's reference setup which only feeds mm_prev, pm_prev.
#   3. dropout: 0.3, weight_decay: 1e-3, hidden: 128
#        With ~440k parameters and only 488 training trajectories, the prior
#        run overfit (train→0.013, val→0.05 then diverging). Slimming and
#        regularising more aggressively.
#   4. tf_drop_epoch: 25
#        Earlier TF drop. The previous run kept TF on for 70 epochs, by which
#        point the model has memorised the TF distribution and can't roll out.

# Diagnosis of the overshoot:
#   For pm to stay 0, the model needs to drive one of {VTXmax, VTLmax, kmt}
#   very low. But VTLmax floor is 3e-5 and the model already sits at 3e-2
#   (sigmoid 0.7) by default. Even at minimum VTLmax, with typical reagents,
#   pm still grows. The model has no parameter setting available that produces
#   "no protein." Lowering the VTLmax/VTXmax floor to 1e-7 (4 orders below
#   current) allows the model to shut off translation/transcription when it
#   sees a failure-pattern reagent mix.

study: real_ivtt_test
exp_name: stepwise_dna_fix
out_root: experiments

epochs: 150
batch_size: 32
lr: 5.0e-5
loss_type: mse
normalize_by_species_mean: true
obs_normalization: minmax
weight_decay: 1.0e-3
val_n: 104
test_n: 104
split_seed: 42
seed: 3

hidden: 256
lift_dim: 32
num_layers: 2
dropout: 0.1
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 25

scaffold: txtl_resource_and_maturation_dna
dataset_path: datasets/real_ivtt_full.npz

stratified_split: true
stratify_bins: 5
stratify_targets: [3, 5]

obs_idx: [3, 5]

lambda_r_terminal: 0.00001
r_terminal_frac: 0.05
lambda_o_terminal: 00
o_terminal_frac: 0.05

theta_lo: 1.0e-6
theta_hi: 1.0
# Override per-parameter bounds for the TXTL scaffold:
# theta = [lam, lam_O, VTXmax, kdm, VTLmax, kmt, kmatm]
theta_lo_vec: [1.0e-6, 1.0e-6, 1.0e-7, 1.0e-5, 1.0e-7, 1.0e-5, 5.0e-5]
theta_hi_vec: [5.0e-4, 5.0e-4, 1.2e-1, 1.0e-2, 8.0e-2, 3.5e-4, 3.5e-3]
n_substeps: 1

# --- The fix ---
u_transform: cumsum         # unchanged — keeps reagent composition visible after t=0 boluses
y_transform: sqrt           # NEW — compresses the y_in scale so reagents aren't drowned out
gru_y_obs_only: true        # NEW — feed only [mm, pm] to GRU; drop fabricated latents
exclude_ode_cols_from_gru: true

head_bias_init: 0.0
head_weight_gain: 1.0       # was 3.0; with smaller hidden + dropout, default init is fine

ckpt_every: 10
jit_scripting: false
# torch_compile=true breaks on MPS (Metal buffer-resource limit). Leave off for
# local Mac testing; flip to true (or `--set torch_compile=true`) on the cluster.
torch_compile: true
model_class: ode_rnn_txtl

endpoint_r2: true
