# Exact architectural translation of configs_oliver (supervisor's GRU model)
# into the ODE-RNN framework, for real_ivtt_raw_no_outliers.npz (7-state dataset).
#
# Key fixes vs old txtl_supervisor_pure.yaml:
#   1. theta_head_transform: log_gamma  — supervisor's gamma() is log-space (not linear)
#   2. theta_head_tau: 2.3              — supervisor uses sigmoid(raw/2.3), prevents head saturation
#   3. y_transform: sqrt_clamp1         — supervisor: sqrt(mm).clamp_min(1), not sqrt(clamp_min(0))
#   4. obs_normalization: log1p_clip1_both — clips BOTH pred and target at 1 (not just target)
#   5. lr: 0.0023, weight_decay: 0.0008, hidden: 400, tf_every: 200
#   6. tighter theta bounds matching supervisor's exact values
#
# Supervisor's theta bounds (from configs_oliver):
#   lam:    [1e-6, 5e-4]
#   lam_O:  [1e-6, 5e-4]
#   VTXmax: [5e-5, 0.1]
#   kdm:    [1e-5, 1e-2]
#   VTLmax: [5e-5, 0.06]  ← NOT 0.08
#   kmt:    [1e-5, 3.5e-4]
#   kmatm:  [5e-5, 3.5e-3]

study: fix_training
exp_name: supervisor_mirror_7state
out_root: experiments

dataset_path: datasets/real_ivtt_raw_no_outliers.npz
scaffold: txtl_resource_and_maturation_dna
model_class: ode_rnn_txtl

# Supervisor budget (from configs_oliver comments)
epochs: 400
batch_size: 200
lr: 0.0023
weight_decay: 0.0008

val_n: 64
test_n: 64
seed: 1
split_seed: 42

stratified_split: true
stratify_bins: 5
stratify_targets: [3, 5]   # mm=3, pm=5 in 7-state [R,O,m,mm,p,pm,DNA] space

# Supervise only mm and pm (indices 3 and 5 in 7-state space)
obs_idx: [3, 5]

# Supervisor theta bounds — exact match
theta_lo: 1.0e-6
theta_hi: 1.0
theta_lo_vec: [1.0e-6, 1.0e-6, 5.0e-5, 1.0e-5, 5.0e-5, 1.0e-5, 5.0e-5]
theta_hi_vec: [5.0e-4, 5.0e-4, 1.0e-1, 1.0e-2, 6.0e-2, 3.5e-4, 3.5e-3]

# Architecture
hidden: 400
lift_dim: 32
num_layers: 2
dropout: 0.2
grad_clip: 1.0
n_substeps: 1

# Head — supervisor's log-space gamma with tau=2.3
theta_head_transform: log_gamma
theta_head_tau: 2.3           # KEY: supervisor uses sigmoid(raw/2.3), flattens slope
head_bottle: true             # supervisor: hidden→128→SiLU→64→SiLU before head
lift_skip: true               # supervisor: no lift MLP, feat → GRU directly
head_bias_init: 0.0
head_weight_gain: 1.0

# Feature transforms — exact supervisor recipe
u_transform: sqrt             # sqrt(u_k) for GRU input
y_transform: sqrt_clamp1      # KEY: sqrt(y).clamp_min(1), not sqrt(clamp_min(0)(y))
gru_y_obs_only: true          # only mm_prev and pm_prev to GRU (not full state)
exclude_ode_cols_from_gru: false  # supervisor feeds ALL u cols including DNA
detach_y_prev: true

# Loss — supervisor clips BOTH pred and target at 1 before log1p
loss_type: mse
obs_normalization: log1p_clip1_both
auto_scale_aux_losses: false
normalize_by_species_mean: false

# Supervisor's N=3 second-half weighting is NOT replicated here.
# The additive pm_tail_loss has a different denominator (0.5K vs 2K),
# so lambda=2.0 produces a ~9:1 ratio instead of 3:1 and destabilizes training.
# The log1p_clip1_both loss alone is the main structural change — drop this.
lambda_pm_tail: 0.0
pm_tail_obs_idx: 1
pm_tail_frac: 0.5

# No aux losses (supervisor has none)
lambda_endpoint: 0.0
lambda_r_terminal: 0.0
lambda_o_terminal: 0.0
l1_regularization: false
l2_regularization: false

# Teacher forcing every 200 steps (from configs_oliver forward loop k%200==0)
teacher_forcing: true
tf_every: 200
tf_drop_epoch: 999999

early_stop_patience: 100
early_stop_min_delta: 0.0

ckpt_every: 50
jit_scripting: false
torch_compile: false
endpoint_r2: true
