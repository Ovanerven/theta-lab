# Real IVTT data, full 6-state TXTL maturation scaffold.
# Grouped Transformer variant: grouped teacher-forcing phases with AR gaps.

study: real_ivtt_test
exp_name: txtl_transformer_grouped_default_lr1e-4_group16_ar16_cw128
out_root: experiments

epochs: 100
batch_size: 32
lr: 0.0001
warmup_epochs: 10
cosine_decay: true
weight_decay: 0.0085
val_n: 64
test_n: 64
seed: 42

hidden: 128
lift_dim: 32
num_layers: 2
ff_mult: 4
grad_clip: 1.0

teacher_forcing: true
tf_every: 50
tf_drop_epoch: 80

# Grouped-TF schedule (used by ode_transformer_grouped)
# tf_every is ignored in grouped mode; schedule is determined by these params.
context_len: 128
tf_group_size: 16
ar_gap: 16

scaffold: txtl_maturation_dna
dataset_path: datasets/real_ivtt_full.npz

# Supervise only the two observed states: mm (Broccoli) and pm (mCherry/2).
obs_idx: [2, 4]

# Per-parameter theta bounds come from scaffold vectors; scalars are fallbacks.
theta_lo: 1.0e-6
theta_hi: 1.0
n_substeps: 1

ckpt_every: 10
jit_scripting: false
torch_compile: false
autocast_bf16: false
model_class: ode_transformer_grouped
