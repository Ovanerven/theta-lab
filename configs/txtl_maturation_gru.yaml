# Real IVTT data, full 6-state TXTL maturation scaffold.
# States [R, m, mm, p, pm, DNA]; DNA is driven by u_to_y_jump from the "DNA c"
# column of u_seq (dilution-corrected concentration delta).

study: real_ivtt_test
exp_name: txtl_gru_stepwise_stratified_mse_seed1
out_root: experiments

epochs: 20
batch_size: 150
lr: 0.0001
loss_type: rmse
normalize_by_species_mean: true
weight_decay: 0.0085
# train_R uses count-based split fields; for N=696, 15% -> 104 per split.
val_n: 104
test_n: 104
split_seed: 42
seed: 1

hidden: 256
lift_dim: 32
num_layers: 2
dropout: 0.1
grad_clip: 1.0

teacher_forcing: true
tf_every: 100
tf_drop_epoch: 500

scaffold: txtl_resource_and_maturation_dna
dataset_path: datasets/real_ivtt_full_fix.npz

# Balance endpoint outcome distributions across train/val/test.
stratified_split: true
stratify_bins: 5
stratify_targets: [3, 5]

# Supervise only the two observed states: mm (Broccoli) and pm (mCherry/2).
# R, m, p, DNA evolve silently; DNA is clamped by the jump from u_seq.
obs_idx: [3, 5]

# Push R -> 0 over the final r_terminal_frac of each trajectory
# (resource depletion prior). R is NOT in obs_idx — this is the only
# supervision it gets.
lambda_r_terminal: 1
r_terminal_frac: 0.05

# Per-parameter theta bounds come from the scaffold itself
# (theta_lo_vec / theta_hi_vec); these scalars are fallbacks, unused here.
theta_lo: 1.0e-6
theta_hi: 1.0
n_substeps: 1

ckpt_every: 10
jit_scripting: true
model_class: ode_rnn

endpoint_r2: true
