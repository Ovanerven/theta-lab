# Final architecture comparison — all 4 models at bs=64, both datasets, 3 seeds.
# Fair comparison: same batch size for everyone.
# 4 models x 2 datasets x 3 seeds = 24 runs.

study: arch_comparison_bs32
runs_per_job: 3
time: "08:00:00"
compare_time: "01:00:00"
partition: gpu_a100

runs:
  # --- GRU --- (done, commented out)
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 42, exp_name: gru_mof4_bs32_s42}
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 0,  exp_name: gru_mof4_bs32_s0}
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 1,  exp_name: gru_mof4_bs32_s1}
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 42, exp_name: gru_enzyme_bs32_s42}
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 0,  exp_name: gru_enzyme_bs32_s0}
  # - {base_config: configs/archs/gru.yaml,         batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 1,  exp_name: gru_enzyme_bs32_s1}
  # --- LSTM --- (done, commented out)
  - {base_config: configs/archs/lstm.yaml,        batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 42, exp_name: lstm_mof4_bs32_s42}
  - {base_config: configs/archs/lstm.yaml,        batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 42, exp_name: lstm_enzyme_bs32_s42}
  # --- Mamba ---
  - {base_config: configs/archs/mamba.yaml,       batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 42, exp_name: mamba_mof4_bs32_s42, env: mamba_env}
  - {base_config: configs/archs/mamba.yaml,       batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 42, exp_name: mamba_enzyme_bs32_s42, env: mamba_env}
  # --- Transformer --- (most done, only s1 mof4 NaN'd)
  - {base_config: configs/archs/transformer.yaml, batch_size: 32, dataset_path: datasets/mof_synthesis_4.npz,        scaffold: mof_synthesis_4,       seed: 42, exp_name: trans_mof4_bs32_s42}
  - {base_config: configs/archs/transformer.yaml, batch_size: 32, dataset_path: datasets/single_enzyme_lumped.npz,   scaffold: single_enzyme_lumped,  seed: 42, exp_name: trans_enzyme_bs32_s42}
