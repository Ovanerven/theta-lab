# Seed/split sensitivity over the FULL mirror.
# Use AFTER `supervisor_mirror_ablation.yaml` confirms which diffs matter; this
# is the equivalent of supervisor_mirror_seed_sweep.yaml but on the corrected
# config so the seed search is over the same prior the supervisor uses.

study: supervisor_mirror_full_seed56
runs_per_job: 1
time: "05:00:00"
partition: gpu_h100
no_plot: false
base_config: configs/supervisor_mirror_full.yaml

fixed:
  dataset_path: datasets/real_ivtt_raw_no_outliers.npz
  scaffold: txtl_resource_and_maturation_dna
  model_class: ode_rnn_txtl
  val_n: 64
  test_n: 64
  endpoint_r2: true

runs:
  # - {exp_name: s1_sp42,    seed: 1,    split_seed: 42}
  # - {exp_name: s17_sp99,   seed: 17,   split_seed: 99}
  # - {exp_name: s42_sp7,    seed: 42,   split_seed: 7}
  # - {exp_name: s137_sp23,  seed: 137,  split_seed: 23}
  # - {exp_name: s256_sp11,  seed: 256,  split_seed: 11}
  # - {exp_name: s314_sp88,  seed: 314,  split_seed: 88}
  - {exp_name: s56_sp56,  seed: 56,  split_seed: 56}

