# Rerun of the A4 (full combined + synth, test_real_only) sLSTM variants only.
# Original launch underestimated wall time: at ~220s/epoch in eager mode,
# 100 epochs needed 6h+ but the time limit was 4h. JIT scripting now fixed
# (ode_slstm.py: List/Dict type annotations added), so eager fallback no
# longer happens — expect ~30-40% speedup. With time bumped to 8h we have
# comfortable headroom either way.

study: txtl_data_axis_m5_slstm
runs_per_job: 1
time: "08:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 100
  endpoint_r2: true
  scaffold: txtl_resource_and_maturation_dna
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  model_class: ode_slstm
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5

runs:
  - exp_name: A4_full_combined_plain_seed1
    seed: 1
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true
  - exp_name: A4_full_combined_plain_seed2
    seed: 2
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true
  - exp_name: A4_full_combined_plain_seed3
    seed: 3
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true

  - exp_name: A4_full_combined_drecipe_seed1
    seed: 1
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
  - exp_name: A4_full_combined_drecipe_seed2
    seed: 2
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
  - exp_name: A4_full_combined_drecipe_seed3
    seed: 3
    dataset_path: datasets/cell-free/txtl_combined_plus_legacy.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
