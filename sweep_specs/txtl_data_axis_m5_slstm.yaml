# Phase A data axis — sLSTM mirror of txtl_data_axis_m5.yaml.
#
# Same 4 dataset variants × same 2 losses × 3 seeds = 24 runs. Only encoder
# differs (model_class: ode_slstm instead of ode_rnn). Lets you compare GRU
# vs sLSTM head-to-head on every (dataset, loss) cell.
#
# Loss caveat (same as GRU sweep): plain_mse and d_recipe both run on the
# Model 5 scaffold (txtl_resource_and_maturation_dna). The supervisor's
# verbatim loss (use_ivtt_mse_loss: true) needs scaffold=ivtt_analytic and
# is covered by the parity_slstm sweep separately — not duplicated here.
#
# Optional later: c_recipe variants (sLSTM's best loss from the parity
# sweep — no clamp, no /3 normaliser). Add a third loss group if D and
# plain_mse both underperform compared to the GRU+D winner.

study: txtl_data_axis_m5_slstm
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 100
  endpoint_r2: true
  scaffold: txtl_resource_and_maturation_dna   # Model 5
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600   # same h as GRU sweep for clean encoder comparison; note sLSTM
                # single-seed first pass had h=600 underperform h=400 — possibly
                # an init issue resolved by warmup, but watch the results
  model_class: ode_slstm   # ← only difference from txtl_data_axis_m5.yaml
  # Stratified random split — balances both metrics across train/val/test and
  # avoids dependency on Bob's pre-curated 3seed_splits.npz files. Per-run
  # blocks below set stratify_z_expr per dataset (true when synth is in the mix).
  stratified_split: true
  stratify_targets: [3, 5]   # mm + pm endpoint quantile balance
  stratify_bins: 5

runs:
  # ═══════════════════════════════════════════════════════════════════════════
  # A1 — OLD only, native 60s grid (interpolation control). N=695 → 87.
  # ═══════════════════════════════════════════════════════════════════════════
  - exp_name: A1_old_native_plain_seed1
    seed: 1
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false
  - exp_name: A1_old_native_plain_seed2
    seed: 2
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false
  - exp_name: A1_old_native_plain_seed3
    seed: 3
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false

  - exp_name: A1_old_native_drecipe_seed1
    seed: 1
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
  - exp_name: A1_old_native_drecipe_seed2
    seed: 2
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
  - exp_name: A1_old_native_drecipe_seed3
    seed: 3
    dataset_path: datasets/cell-free/real_ivtt_exact_full_drop5000.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    use_synthetic_data: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

