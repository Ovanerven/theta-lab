# Short sweep — test every NEW-data intervention in isolation.
#
# Goal: figure out which (if any) of our recent additions actually moves
# R²(NEW) off its current ~-0.36 floor. Each arm changes ONE thing vs the
# baseline, so we can attribute any improvement.
#
# Naming convention (kept unambiguous since "upsample" was used for two
# different things in earlier conversations):
#   grid_uniform     = NEW *time grid* upsampled to OLD's 60s/50h regular grid
#                      (counterfactual to dt-aware encoder)
#   loss_upweight5x  = NEW *samples* weighted 5× in the loss
#                      (gradient-level domain re-balancing)
#   sample_oversample = NEW samples *resampled into more batches* via a
#                       WeightedRandomSampler (data-level re-balancing,
#                       effectively oversampling the minority class)
#
# All B arms use the same NPZ (txtl_native_real_only.npz, OLD+NEW real),
# dt-aware encoder, D-recipe loss, seed=2, 50 epochs. Only the marked
# intervention differs per arm.
#
# 5 runs total → 2 batches of 3 ≈ 6h wall-clock at the 3-parallel limit.

study: txtl_data_axis_native_gru_intervention_test
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 50
  endpoint_r2: true
  scaffold: txtl_resource_and_maturation_dna
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  seed: 2
  y0_theta_init: false
  # D-recipe composable loss
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  # Stratified random split on (mm, pm) endpoint quantiles
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  # Runtime min-gate (matches OLD's upstream blanking on NEW mm/pm)
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  # Diagnostics: dump 5 extra NEW-test sample plots (no-op on A_old_only)
  plot_extra_new_samples: 5

runs:
  # ── Baselines ────────────────────────────────────────────────────────────
  # A: OLD only — best-case ceiling, no recipe-shift to handle.
  - exp_name: A_old_only
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true

  # B: OLD + NEW, no interventions. dt-aware encoder (log_dt feature).
  # This is the run we expect to reproduce R²(OLD)≈+0.29, R²(NEW)≈-0.36.
  - exp_name: B_native
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true

  # ── Grid intervention ────────────────────────────────────────────────────
  # B + grid_uniform: NEW resampled to OLD's 60s/50h regular grid via
  # sum-of-deltas (u_seq) and linear interp (y_seq). dt is now constant 60s
  # across all samples, so the dt-aware encoder gives no extra signal.
  # Tests whether the non-uniform dt was the actual bottleneck.
  - exp_name: B_grid_uniform
    dataset_path: datasets/cell-free/txtl_native_real_only_upsampled.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: false   # dt is constant on this NPZ; flag is no-op

  # ── Loss-level domain re-balancing ───────────────────────────────────────
  # B + loss_upweight5x: per-sample loss weight 5.0 for NEW, 1.0 for OLD.
  # Each NEW sample contributes 5× as much to the gradient. Data
  # distribution unchanged.
  - exp_name: B_loss_upweight5x
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true
    source_loss_weights: {old: 1.0, new: 5.0}

  # ── Data-level domain re-balancing ───────────────────────────────────────
  # B + sample_oversample: WeightedRandomSampler with inverse-frequency
  # weights. Each minibatch contains ~50/50 OLD/NEW samples (NEW seen
  # ~2.2× more often per epoch). Effectively oversamples the minority.
  - exp_name: B_sample_oversample
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true
    balance_source_sampler: true
