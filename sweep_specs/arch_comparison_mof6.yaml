# Architecture comparison on MOF crystal synthesis (mof_synthesis_6).
# Mirrors arch_comparison_mof6.sh but driven by the launcher.
# Mamba-SSM uses mamba_env — the launcher automatically puts it in its own job.

study: arch_comparison_mof6
dataset_path: datasets/mof_synthesis_6.npz
scaffold: mof_synthesis_6

runs_per_job: 2   # GRU+LSTM can share a job; transformer and mamba get their own
time: "04:00:00"
compare_time: "01:00:00"

runs:
  - model_class: ode_rnn
    base_config: configs/archs/gru.yaml
    exp_name: gru

  - model_class: lstm_rnn
    base_config: configs/archs/gru.yaml
    exp_name: lstm

  - model_class: ode_transformer
    base_config: configs/archs/transformer.yaml
    exp_name: transformer
    context_len: 128
    warmup_epochs: 10

  - model_class: ode_mamba_ssm
    base_config: configs/archs/mamba_ssm.yaml
    exp_name: mamba_ssm
    dropout: 0.1
    env: mamba_env
