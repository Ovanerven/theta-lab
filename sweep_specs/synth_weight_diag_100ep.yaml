# M5 combined, 100 epochs, 3 seeds — does synth_w0.01 (best at 20 ep)
# still beat the ladder's default (synth=1.0, balance_source_sampler=true)
# once the real-only arm has had time to converge?
#
# Anchor = the existing ladder default (synth weight = 1.0, balance=true),
# which is what M5_drecipe_s* in txtl_ladder_native_combined.yaml uses.
# Treatment = same recipe but source_loss_weights.synth = 0.01.

study: synth_weight_diag_100ep
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: true
base_config: configs/txtl_gru_new_baseline.yaml

_drecipe: &drecipe
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

fixed:
  scaffold: txtl_resource_and_maturation_dna
  epochs: 100
  warmup_epochs: 5
  endpoint_r2: true
  obs_idx: [3, 5]
  hidden: 600
  val_n: 125
  test_n: 125
  stratify_z_expr: false
  test_real_only: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  y0_theta_init: false
  model_class: ode_rnn
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  balance_source_sampler: true
  <<: *drecipe

runs:
  # Anchor: ladder default (synth weight = 1.0)
  - {exp_name: w1p0_s0, seed: 0}
  - {exp_name: w1p0_s1, seed: 1}
  - {exp_name: w1p0_s2, seed: 2}

  # Treatment: synth weight = 0.01
  - {exp_name: w0p01_s0, seed: 0, source_loss_weights: {synth: 0.01}}
  - {exp_name: w0p01_s1, seed: 1, source_loss_weights: {synth: 0.01}}
  - {exp_name: w0p01_s2, seed: 2, source_loss_weights: {synth: 0.01}}
