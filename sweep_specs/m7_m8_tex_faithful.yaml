# M7 / M8 background-fix sweep — 4 runs × 100 epochs.
#
# Root cause of M7/M8 underfitting (train loss ~2.5 vs M5's 0.28):
#   ~16% real samples have K-Glut=0 bolus but still express (background K from
#   lysate). Gate g_K = K_p/(K_K + K_p) → 0 when K_p=0 regardless of K_K.
#   Model predicts mm=pm=0 for those samples → structural loss floor.
#
# Fix: M7_bg_fixed / M8_bg_fixed add learned per-reagent background offsets
#   to theta so gates use (bolus + bg) instead of raw bolus. The GRU encoder
#   learns sample-specific backgrounds. DNA-absent synth kills still work
#   via the DNA_p=0 term in dm/dp, independent of g_expr.
#
# 4 runs:
#   M7_bg_real      — background fix, real_only         (does bg alone fix M7?)
#   M7_bg_boundary  — background fix, combined+L_zero   (full M7 fix; also running locally)
#   M8_bg_real      — same background fix for M8        (same root cause)
#   [M8_bg_boundary deferred — n_substeps=2 slow; test real_only first]
#
# Compare against v3 baselines:
#   M7_fixed_real  R²_pm=-0.24  (no bg fix, real_only)
#   M8_fixed_real  best_val=2.69 (no bg fix, real_only)
#
# Run on cluster:
#   python launch_sweep.py sweep_specs/m7_m8_tex_faithful.yaml

study: m7_m8_tex_faithful
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_drecipe: &drecipe
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

_real_only: &real_only
  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false

_combined_boundary: &combined_boundary
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  balance_source_sampler: true
  lambda_zero_traj: 0.005
  test_real_only: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]

fixed:
  epochs: 100
  warmup_epochs: 3
  batch_size: 100
  lr: 0.002
  weight_decay: 0.0018
  seed: 0
  split_seed: 42
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  test_real_only: true
  hidden: 600
  num_layers: 2
  dropout: 0.2
  model_class: ode_rnn
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  y0_theta_init: false
  jit_scripting: true
  ckpt_every: 0
  endpoint_r2: true
  plot_extra_new_samples: 3
  <<: *drecipe

runs:
  # ── M7: background fix, real_only ─────────────────────────────────────────
  # Key question: does the background fix alone get M7 training loss unstuck?
  - exp_name: M7_bg_real
    scaffold: txtl_model7_bg_fixed
    n_substeps: 1
    <<: *real_only

  # ── M7: background fix + combined + L_zero (full fix) ─────────────────────
  # Also running locally for early signal; this queues the cluster version.
  - exp_name: M7_bg_boundary
    scaffold: txtl_model7_bg_fixed
    n_substeps: 1
    <<: *combined_boundary

  # ── M8: background fix, real_only ─────────────────────────────────────────
  # Same root cause as M7 (K-Glut=0 → f_K=0 → v_TX=v_TL=0).
  # M8_bg_fixed adds E_bg, A_bg, Mg_bg, K_bg, C_bg to theta (theta_dim 16→21).
  - exp_name: M8_bg_real
    scaffold: txtl_model8_bg_fixed
    n_substeps: 2
    <<: *real_only

  # ── M8: background fix + combined ─────────────────────────────────────────
  - exp_name: M8_bg_boundary
    scaffold: txtl_model8_bg_fixed
    n_substeps: 2
    <<: *combined_boundary
