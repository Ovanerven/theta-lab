# Plain MSE counterpart. Mirrors gru.yaml + slstm.yaml structure but with
# plain masked log1p MSE (no D-recipe knobs). Combines GRU and sLSTM.
# C/synth arms dropped — synth doesn't fix the OLD/NEW imbalance.

study: txtl_data_axis_native_plainmse_clean
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 50
  endpoint_r2: true
  scaffold: txtl_resource_and_maturation_dna
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  seed: 2
  y0_theta_init: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  plot_extra_new_samples: 5

runs:
  # ─── GRU (6 arms) ─────────────────────────────────────────────────────────
  - exp_name: gru_A_native
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true

  - exp_name: gru_B_native
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true

  - exp_name: gru_B_upsampled
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_real_only_upsampled.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: false

  - exp_name: gru_B_native_upweight5x
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true
    source_loss_weights: {old: 1.0, new: 5.0}

  - exp_name: gru_B_native_balanced
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true
    balance_source_sampler: true

  - exp_name: gru_B_native_both
    model_class: ode_rnn
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    encoder_use_log_dt: true
    source_loss_weights: {old: 1.0, new: 5.0}
    balance_source_sampler: true

  # ─── sLSTM (6 arms) ───────────────────────────────────────────────────────
  - exp_name: slstm_A_native
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false

  - exp_name: slstm_B_native
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false

  - exp_name: slstm_B_upsampled
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_real_only_upsampled.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false

  - exp_name: slstm_B_native_upweight5x
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    source_loss_weights: {old: 1.0, new: 5.0}

  - exp_name: slstm_B_native_balanced
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    balance_source_sampler: true

  - exp_name: slstm_B_native_both
    model_class: ode_slstm
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    source_loss_weights: {old: 1.0, new: 5.0}
    balance_source_sampler: true
