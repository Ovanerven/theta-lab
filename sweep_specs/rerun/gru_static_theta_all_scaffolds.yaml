# GRU-static-theta data-ablation (Model B1): ode_rnn_sparse_theta_v2 with
# n_theta_anchors=1 -- the GRU fires its theta head ONCE at step 0, then the
# (per-trajectory but time-invariant) theta is reused for the full rollout.
# Sits between A2 (IC theta via MLP) and A6 (CMVF, time-varying GRU theta).
#
# 11 scaffolds x 4 datapoint counts x {full, first_last} = 88 runs.
# Each run sets its own `study:` so outputs land in the matching
# experiments/<scaffold>_data_ablation/ folder alongside A1..A9. The new
# rows pick up automatically the next time you run:
#   .venv/bin/python scripts/aggregate_from_cache.py
#
# Launch (local, no SLURM):
#   python launch_sweep.py sweep_specs/rerun/gru_static_theta_all_scaffolds.yaml --local --max-parallel 2 --no-compare

study: gru_static_theta_sweep    # placeholder; per-run `study:` overrides
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: false

fixed:
  epochs: 100

runs:
  # ── single_enzyme_lumped  (P=2)  →  experiments/single_enzyme_lumped_data_ablation/
  - {study: single_enzyme_lumped_data_ablation, base_config: configs/single_enzyme/single_enzyme.yaml, scaffold: single_enzyme_lumped, model_class: ode_rnn_sparse_theta_v2, n_theta_anchors: 1, exp_name: B1_gru_static_theta_n3, dataset_path: datasets/single_enzyme/single_enzyme_lumped_n3.npz, val_n: 1, test_n: 1}
  - {study: single_enzyme_lumped_data_ablation, base_config: configs/single_enzyme/single_enzyme.yaml, scaffold: single_enzyme_lumped, model_class: ode_rnn_sparse_theta_v2, n_theta_anchors: 1, exp_name: B1_gru_static_theta_first_last_n3, dataset_path: datasets/single_enzyme/single_enzyme_lumped_n3.npz, val_n: 1, test_n: 1, obs_idx: [0, 1]}
