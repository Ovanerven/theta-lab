  - {study: mof_synthesis_6_arch_sweep_n3, base_config: configs/archs/gru.yaml, scaffold: mof_synthesis_6, exp_name: gru_mof6_n3_s42, dataset_path: datasets/mof/mof_synthesis_6_n3.npz, val_n: 1, test_n: 1, seed: 42, epochs: 100, batch_size: 32}
