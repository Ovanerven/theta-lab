  - {study: mof_synthesis_6_arch_sweep_n10, base_config: configs/archs/mamba.yaml, scaffold: mof_synthesis_6, exp_name: mamba_mof6_n10_s42, dataset_path: datasets/mof/mof_synthesis_6_n10.npz, val_n: 1, test_n: 1, seed: 42, epochs: 100, batch_size: 32, env: mamba_env}
  - {study: mof_synthesis_6_arch_sweep_n10, base_config: configs/archs/mamba.yaml, scaffold: mof_synthesis_6, exp_name: mamba_mof6_n10_fl_s42, dataset_path: datasets/mof/mof_synthesis_6_n10.npz, val_n: 1, test_n: 1, seed: 42, epochs: 100, batch_size: 32, obs_idx: [0, 5], env: mamba_env}
