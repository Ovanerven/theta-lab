  - {study: mof_synthesis_6_arch_sweep_n10, base_config: configs/archs/lstm.yaml, scaffold: mof_synthesis_6, exp_name: lstm_mof6_n10_fl_s42, dataset_path: datasets/mof/mof_synthesis_6_n10.npz, val_n: 1, test_n: 1, seed: 42, epochs: 100, batch_size: 32, obs_idx: [0, 5]}
