# Hidden-dim first pass on sLSTM + D-recipe composable loss. Mirror of
# txtl_hidden_dim_sweep.yaml but with model_class=ode_slstm (via base config).
#
# warmup_epochs=5 baked in from the GRU sweep lesson (h=600/800 NaN'd with
# lr=0.002 and no warmup). sLSTM has different stability characteristics but
# warmup is cheap insurance either way.

study: txtl_hidden_dim_sweep_slstm
runs_per_job: 1
time: "03:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/ivtt_slstm.yaml

fixed:
  epochs: 100
  endpoint_r2: true
  obs_idx: [3, 5]
  seed: 1
  warmup_epochs: 5
  # D-recipe composable loss (best on GRU parity sweep)
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

runs:
  - {exp_name: h200, hidden: 200}
  - {exp_name: h300, hidden: 300}
  - {exp_name: h400, hidden: 400}
  - {exp_name: h600, hidden: 600}
  - {exp_name: h800, hidden: 800}
