# Synth-data diagnostic sweep — focused on the two new mechanisms:
#   1. Physical subsampling (synth_max_samples)
#   2. Per-channel pm mask for synth (synth_obs_mask_channels)
#   3. Both combined
# Plus anchor_real as the upper-bound reference.
#
# Run locally: python launch_sweep.py sweep_specs/synth_weight_diag.yaml --local --max-parallel 1

study: synth_weight_diag
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: true
base_config: configs/txtl_gru_new_baseline.yaml

_drecipe: &drecipe
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

fixed:
  scaffold: txtl_resource_and_maturation_dna
  seed: 0
  epochs: 20
  warmup_epochs: 2
  endpoint_r2: true
  obs_idx: [3, 5]
  hidden: 600
  val_n: 125
  test_n: 125
  stratify_z_expr: false
  test_real_only: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  y0_theta_init: false
  model_class: ode_rnn
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  <<: *drecipe

runs:
  # ── Reference: real data only (no synth at all) ───────────────────────────
  # - exp_name: anchor_real
  #   dataset_path: datasets/cell-free/txtl_native_real_only.npz
  #   balance_source_sampler: false
  #   test_real_only: false

  # ── Subsample: keep 150 synth rows (≈6% of 2496) ─────────────────────────
  # - exp_name: synth_sub150
  #   synth_max_samples: 150
  #   balance_source_sampler: false

  # ── Channel mask: zero pm in loss for synth, keep mm gradient ─────────────
  # - exp_name: synth_mask_pm
  #   synth_obs_mask_channels: [5]
  #   balance_source_sampler: true

  # ── Combined: subsample + pm mask ─────────────────────────────────────────
  # - exp_name: synth_sub150_mask_pm
  #   synth_max_samples: 150
  #   synth_obs_mask_channels: [5]
  #   balance_source_sampler: false

  # ── Subsampling × pm-mask ablation ────────────────────────────────────────
  # All three keep balance_source_sampler=true so the only axis that changes
  # is the number of unique synth samples (and therefore how many times each
  # synth sample is replayed per epoch). Lets us isolate whether the masked-pm
  # win at 2496 comes from having many diverse synth mm trajectories or whether
  # a fraction is already enough.
  #
  #   sub500  → 500 synth, each seen ~5× per epoch (vs 2496 → ~1×)
  #   sub1000 → 1000 synth, each seen ~2.5× per epoch
  #   mask_pm → 2496 synth (already ran: +0.306 vs baseline)
  - exp_name: synth_sub500_mask_pm
    synth_max_samples: 500
    synth_obs_mask_channels: [5]
    balance_source_sampler: true

  - exp_name: synth_sub1000_mask_pm
    synth_max_samples: 1000
    synth_obs_mask_channels: [5]
    balance_source_sampler: true
