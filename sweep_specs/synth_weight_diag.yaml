# Diagnostic sweep: how much does synth weight hurt real-data protein prediction?
#
# The final_native_ladder_sweep showed M5_real (real_only) crushes M5_drecipe
# (combined+synth) on protein endpoint R²: 0.41 vs 0.09.
# balance_source_sampler=true gives OLD/NEW/SYNTH each 1/3 of gradient — but
# synth trajectories all have pm≈0 (no-expression), so even 1/3 synth pulls
# protein predictions toward zero.
#
# This sweep tests source_loss_weights.synth at a range of values to find the
# crossover where combined+synth starts matching real_only on protein R².
# M5 + D-recipe, seed=0 only, 10 epochs to see val pm loss trend.
# Run locally: python launch_sweep.py sweep_specs/synth_weight_diag.yaml --local --max-parallel 1
#
# Runs (6 total):
#   anchor_real   — real_only dataset, no synth at all  (upper bound)
#   synth_w1p0    — combined, balance=true, synth weight=1.0 (current default)
#   synth_w0p2    — combined, balance=true, synth weight=0.2
#   synth_w0p05   — combined, balance=true, synth weight=0.05
#   synth_w0p01   — combined, balance=true, synth weight=0.01
#   no_synth      — combined npz, use_synthetic_data=false (synth stripped at load)

study: synth_weight_diag
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: true
base_config: configs/txtl_gru_new_baseline.yaml

_drecipe: &drecipe
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

fixed:
  scaffold: txtl_resource_and_maturation_dna
  seed: 0
  epochs: 20
  warmup_epochs: 2
  endpoint_r2: true
  obs_idx: [3, 5]
  hidden: 600
  val_n: 125
  test_n: 125
  stratify_z_expr: false
  test_real_only: true            # always evaluate on real samples only
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]  # exclude is_new@12, u_open@13
  y0_theta_init: false
  model_class: ode_rnn
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  balance_source_sampler: true
  <<: *drecipe

runs:
  # ── Anchor: real data only, no synth ──────────────────────────────────────
  - exp_name: anchor_real
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    balance_source_sampler: false
    test_real_only: false          # real_only npz has no synth, so no need to filter

  # ── Combined + balance_source_sampler, varying synth loss weight ───────────
  # synth weight = 1.0: current default (1/3 gradient each)
  - exp_name: synth_w1p0
    # no source_loss_weights → uniform weight (default)

  # synth weight = 0.2: synth still in batch but 5× less loss contribution
  - exp_name: synth_w0p2
    source_loss_weights: {synth: 0.2}

  # synth weight = 0.05: synth at ~20× less loss contribution
  - exp_name: synth_w0p05
    source_loss_weights: {synth: 0.05}

  # synth weight = 0.01: synth almost silent (50× less)
  - exp_name: synth_w0p01
    source_loss_weights: {synth: 0.01}

  # ── Strip synth entirely at load time (use_synthetic_data=false) ───────────
  # Same combined npz file but z_expr==0 rows dropped before split.
  # Different from anchor_real: split is seeded the same way as combined runs
  # (uses combined's train/val/test pools), so this isolates the synth effect
  # from any split difference.
  - exp_name: no_synth_in_combined
    use_synthetic_data: false
    balance_source_sampler: false  # no synth rows → sampler only sees old/new

  # ── Channel mask: keep synth in batch but zero pm channel in loss ──────────
  # synth samples still contribute mRNA + scaffold structural gradients,
  # but can no longer teach "protein=0" on expressing samples.
  # balance_source_sampler stays true so synth still appears 1/3 of batches.
  - exp_name: synth_mask_pm
    synth_obs_mask_channels: [5]   # raw pm index

  # ── Physical subsampling: keep only N synth rows in the dataset ────────────
  # synth_max_samples=150 ≈ same expected gradient as synth_w0p05 (0.05×2496≈125)
  # but no wasted compute on the other 2346 synth samples.
  # balance_source_sampler=false: with 150 synth vs 1003 real the imbalance is
  # mild (13% synth) so no need to re-inflate synth presence in batches.
  - exp_name: synth_sub150
    synth_max_samples: 150
    balance_source_sampler: false

  # synth_max_samples=30 ≈ synth_w0p01 (0.01×2496≈25), but compute-efficient.
  - exp_name: synth_sub30
    synth_max_samples: 30
    balance_source_sampler: false
