# Hidden-dim first pass on the IVTT-GRU baseline + D-recipe composable loss
# (best parity-sweep variant: clamp=1.0, /3 normaliser, species/time/endpoint
# upweights all on).
#
# Goal: identify ~2 best h-values to deep-dive with 3 seeds and longer epochs.
# This first pass uses a single seed (1) per h to keep cost low; ranking
# stability is checked in the follow-up sweep.
#
# 100 epochs per run is the cheap-insurance budget: long enough that h=200 has
# probably plateaued, and large enough that h=600/800 can warm up. We track
# best-val checkpoint, so even if a large model overfits late we get its peak.
#
# Plan after this sweep:
#   1. Pick top-2 h values by pm endpoint R²
#   2. Re-run those at 3 seeds × longer epochs (e.g., 200) — see follow-up

study: txtl_hidden_dim_sweep
runs_per_job: 1
time: "03:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/ivtt_gru.yaml

fixed:
  epochs: 100
  endpoint_r2: true
  obs_idx: [3, 5]
  seed: 1
  # D-recipe composable loss
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

runs:
  - {exp_name: h200,  hidden: 200}
  - {exp_name: h300,  hidden: 300}
  - {exp_name: h400,  hidden: 400}   # supervisor default
  - {exp_name: h600,  hidden: 600}
  - {exp_name: h800,  hidden: 800}
