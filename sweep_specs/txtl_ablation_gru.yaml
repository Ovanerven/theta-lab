# TXTL ablation sweep (GRU encoder).
#
# Progressive ablation: A1-A4 are alternative approaches, A5-A8 build up
# our method by successively adding components.
#
#   A1  ode_fixed_theta    — single global learnable theta, no NN
#   A2  ode_sample_theta   — per-sample constant theta (MLP encodes y0)
#   A3  neural_ode_gru     — black-box GRU dy/dt (no scaffold, Euler)
#   A4  neural_ode_mlp     — black-box MLP dy/dt (no scaffold, no history)
#   A5  ode_rnn            — GRU + scaffold + unbounded theta (softplus)
#   A6  ode_rnn            — + gamma bounds (our baseline)
#   A7  ode_rnn            — + gamma bounds + L1 theta smoothness
#   A8  ode_rnn            — + gamma bounds + L2 theta smoothness

study: txtl_ablation_gru
runs_per_job: 1
time: "04:30:00"
partition: gpu_a100
no_plot: false

fixed:
  dataset_path: datasets/real_ivtt_full.npz
  scaffold: txtl_maturation_dna
  obs_idx: "[2,4]"
  theta_lo: 1.0e-6
  theta_hi: 1.0
  val_n: 64
  test_n: 64
  seed: 42
  lift_dim: 32
  epochs: 100

runs:
  # A1 — fixed global theta (no NN)
  - {base_config: configs/archs/gru.yaml, model_class: ode_fixed_theta,  exp_name: A1_fixed_theta}
  # A2 — per-sample constant theta (MLP encodes y0, fixed across timesteps)
  - {base_config: configs/archs/gru.yaml, model_class: ode_sample_theta, exp_name: A2_sample_theta}
  # A3 — black-box GRU (dy/dt, Euler, no scaffold)
  - {base_config: configs/archs/gru.yaml, model_class: neural_ode_gru,   exp_name: A3_neural_ode_gru}
  # A4 — black-box MLP (dy/dt, no history)
  - {base_config: configs/archs/gru.yaml, model_class: neural_ode_mlp,   exp_name: A4_neural_ode_mlp}
  # A5 — our method without gamma bounds (softplus, unbounded)
  - {base_config: configs/archs/gru.yaml, model_class: ode_rnn,          exp_name: A5_unbounded, theta_bounded: false}
  # A6 — + gamma bounds → our baseline
  - {base_config: configs/archs/gru.yaml, model_class: ode_rnn,          exp_name: A6_baseline}
  # A7 — + gamma bounds + L1 theta smoothness regularization
  - {base_config: configs/archs/gru.yaml, model_class: ode_rnn,          exp_name: A7_l1reg, l1_regularization: true, lambda_reg: 0.1}
  # A8 — + gamma bounds + L2 theta smoothness regularization
  - {base_config: configs/archs/gru.yaml, model_class: ode_rnn,          exp_name: A8_l2reg, l2_regularization: true, lambda_reg: 0.1}
