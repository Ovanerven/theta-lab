# Test obs_normalization × loss_type to break out of mean-trajectory collapse.
#
# Diagnostic finding (slurm_outputs/diag_deep_22296697.out):
#   pm-final Spearman r = 0.48 vs Pearson r = 0.33  →  model has the right
#   experiment ranking but compresses predictions into a narrow scale band.
#   Strong signal that log_mse is the wrong loss target for this dataset.
#
# This sweep:
#   - uses datasets/real_ivtt_raw.npz (raw mm/pm RFU, raw reagents)
#   - applies u_transform=cumsum_sqrt at runtime (replaces dataset-baked
#     sqrt+MinMax for reagents)
#   - varies obs_normalization for the LOSS target only
#   - pairs each with a sensible base loss_type
#
# 50 epochs, lr=1e-3, hidden=256 (best from prior sweeps). Each combo gets
# 1 anchor seed (=1) to keep the sweep small; rerun the winner with 3 seeds.

study: txtl_obs_norm_sweep_lamrterm_5e-5_no_outliers
runs_per_job: 1
time: "01:30:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_maturation_gru_fix.yaml

fixed:
  dataset_path: datasets/real_ivtt_raw_no_outliers.npz
  scaffold: txtl_resource_and_maturation_dna
  val_n: 64
  test_n: 64
  epochs: 10
  endpoint_r2: true
  lr: 0.001
  hidden: 256
  u_transform: cumsum_sqrt   # replaces dataset-baked sqrt+MinMax
  seed: 1
  lambda_r_terminal: 0.00005
  # ---- Pin values that have drifted in base since 20260428_115706_*. To
  # reproduce that sweep's baseline, hold these fixed in the sweep itself.
  # Base now has lr=5e-5, num_layers=2, dropout=0.1, lambda_o_terminal=0.001,
  # theta_lo_vec/hi_vec set, plus other tweaks. We override the ones that
  # most directly affect the comparison:
  num_layers: 1
  dropout: 0.3
  lambda_o_terminal: 0.0   # base now sets 0.001 — new term, would skew comparison
  # theta_lo_vec / theta_hi_vec: lists can't be cleanly unset via --set, so
  # they stay at the new (tighter) bounds. If you want a strict re-run of
  # the original sweep with scaffold defaults, copy the snapshot into a new
  # base_config: configs/txtl_maturation_gru_fix_obsnorm_snapshot.yaml
  # ---- enable the new auto-scaling so lambdas mean the same across arms
  auto_scale_aux_losses: true

runs:
  # Baseline anchors (raw dataset, current default loss config)
  - {exp_name: ctrl_logmse_none,       loss_type: log_mse, obs_normalization: none}
  - {exp_name: ctrl_mse_none,          loss_type: mse,     obs_normalization: none}

  # === log_mse with various obs_normalization (some combos are weird:
  #     log1p(zscore) etc — included as sanity checks) ===
  - {exp_name: logmse_log1p,           loss_type: log_mse, obs_normalization: log1p}
  - {exp_name: logmse_sqrt,            loss_type: log_mse, obs_normalization: sqrt}

  # === mse on transformed targets — the main hypothesis ===
  - {exp_name: mse_log1p,              loss_type: mse,     obs_normalization: log1p}
  - {exp_name: mse_sqrt,               loss_type: mse,     obs_normalization: sqrt}
  - {exp_name: mse_zscore,             loss_type: mse,     obs_normalization: zscore}
  - {exp_name: mse_minmax,             loss_type: mse,     obs_normalization: minmax}

  # === rmse equivalents ===
  - {exp_name: rmse_zscore,            loss_type: rmse,    obs_normalization: zscore}
  - {exp_name: rmse_minmax,            loss_type: rmse,    obs_normalization: minmax}
