# sLSTM mirror of txtl_data_axis_native_gru.yaml. Same 6-arm structure,
# same datasets, same loss. sLSTM lacks encoder_use_log_dt (would need a
# separate edit to ode_slstm.py); the ODE step still uses dt_per_sample.

study: txtl_data_axis_native_slstm_clean
runs_per_job: 1
time: "04:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 50
  endpoint_r2: true
  scaffold: txtl_resource_and_maturation_dna
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  seed: 2
  y0_theta_init: false
  model_class: ode_slstm
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  plot_extra_new_samples: 5

runs:
  - exp_name: A_native
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false

  - exp_name: B_native
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false

  - exp_name: B_upsampled
    dataset_path: datasets/cell-free/txtl_native_real_only_upsampled.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false

  - exp_name: B_native_upweight5x
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    source_loss_weights: {old: 1.0, new: 5.0}

  - exp_name: B_native_balanced
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    balance_source_sampler: true

  - exp_name: B_native_both
    dataset_path: datasets/cell-free/txtl_native_real_only.npz
    val_n: 125
    test_n: 125
    stratify_z_expr: false
    test_real_only: false
    source_loss_weights: {old: 1.0, new: 5.0}
    balance_source_sampler: true
