# 1-epoch smoke test of every arm in txtl_ladder_old_combined.yaml.
# Goal: verify every arm trains end-to-end (data load → forward → backward →
# eval → R² → plots → checkpoint) without crashing. Don't read into metrics —
# 1 epoch isn't enough to learn anything.
#
# Same 48 arms as the full sweep, just with epochs=1 and a different study name.

study: txtl_ladder_old_combined_smoke
runs_per_job: 1
time: "00:30:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 1
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 1
  hidden: 600
  dataset_path: datasets/cell-free/txtl_native_old_only.npz
  val_n: 87
  test_n: 87
  stratify_z_expr: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  plot_extra_new_samples: 0
  y0_theta_init: false
  model_class: ode_rnn

runs:
  # ─── DENSE ARMS (M3/M4/M5 × {drecipe, plain} × 3 seeds + M5 y0init) ────
  - {exp_name: M3_drecipe_s0, scaffold: txtl_model3_two_state, seed: 0, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M3_drecipe_s1, scaffold: txtl_model3_two_state, seed: 1, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M3_drecipe_s2, scaffold: txtl_model3_two_state, seed: 2, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M3_plain_s0, scaffold: txtl_model3_two_state, seed: 0}
  - {exp_name: M3_plain_s1, scaffold: txtl_model3_two_state, seed: 1}
  - {exp_name: M3_plain_s2, scaffold: txtl_model3_two_state, seed: 2}

  - {exp_name: M4_drecipe_s0, scaffold: txtl_model4_three_state, seed: 0, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M4_drecipe_s1, scaffold: txtl_model4_three_state, seed: 1, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M4_drecipe_s2, scaffold: txtl_model4_three_state, seed: 2, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M4_plain_s0, scaffold: txtl_model4_three_state, seed: 0}
  - {exp_name: M4_plain_s1, scaffold: txtl_model4_three_state, seed: 1}
  - {exp_name: M4_plain_s2, scaffold: txtl_model4_three_state, seed: 2}

  - {exp_name: M5_drecipe_s0, scaffold: txtl_resource_and_maturation_dna, seed: 0, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_drecipe_s1, scaffold: txtl_resource_and_maturation_dna, seed: 1, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_drecipe_s2, scaffold: txtl_resource_and_maturation_dna, seed: 2, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_plain_s0, scaffold: txtl_resource_and_maturation_dna, seed: 0}
  - {exp_name: M5_plain_s1, scaffold: txtl_resource_and_maturation_dna, seed: 1}
  - {exp_name: M5_plain_s2, scaffold: txtl_resource_and_maturation_dna, seed: 2}

  - {exp_name: M5_drecipe_y0on_s0, scaffold: txtl_resource_and_maturation_dna, seed: 0, y0_theta_init: true, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_drecipe_y0on_s1, scaffold: txtl_resource_and_maturation_dna, seed: 1, y0_theta_init: true, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_drecipe_y0on_s2, scaffold: txtl_resource_and_maturation_dna, seed: 2, y0_theta_init: true, use_ivtt_mse_loss: false, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5], loss_normalizer_channels: 3, loss_clamp_min: 1.0}
  - {exp_name: M5_plain_y0on_s0, scaffold: txtl_resource_and_maturation_dna, seed: 0, y0_theta_init: true}
  - {exp_name: M5_plain_y0on_s1, scaffold: txtl_resource_and_maturation_dna, seed: 1, y0_theta_init: true}
  - {exp_name: M5_plain_y0on_s2, scaffold: txtl_resource_and_maturation_dna, seed: 2, y0_theta_init: true}

  # ─── SPARSE-K ARMS (M3/M4/M5/M8 × K ∈ {1,3,6} × 2 seeds, plain loss) ───
  - {exp_name: M3_K1_s1, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 1}
  - {exp_name: M3_K1_s2, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 2}
  - {exp_name: M3_K3_s1, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 1}
  - {exp_name: M3_K3_s2, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 2}
  - {exp_name: M3_K6_s1, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 1}
  - {exp_name: M3_K6_s2, scaffold: txtl_model3_two_state,            model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 2}

  - {exp_name: M4_K1_s1, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 1}
  - {exp_name: M4_K1_s2, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 2}
  - {exp_name: M4_K3_s1, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 1}
  - {exp_name: M4_K3_s2, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 2}
  - {exp_name: M4_K6_s1, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 1}
  - {exp_name: M4_K6_s2, scaffold: txtl_model4_three_state,          model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 2}

  - {exp_name: M5_K1_s1, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 1}
  - {exp_name: M5_K1_s2, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 2}
  - {exp_name: M5_K3_s1, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 1}
  - {exp_name: M5_K3_s2, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 2}
  - {exp_name: M5_K6_s1, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 1}
  - {exp_name: M5_K6_s2, scaffold: txtl_resource_and_maturation_dna, model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 2}

  - {exp_name: M8_K1_s1, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 1}
  - {exp_name: M8_K1_s2, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 1, seed: 2}
  - {exp_name: M8_K3_s1, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 1}
  - {exp_name: M8_K3_s2, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 3, seed: 2}
  - {exp_name: M8_K6_s1, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 1}
  - {exp_name: M8_K6_s2, scaffold: txtl_model8_reagent_resource,     model_class: ode_rnn_sparse_theta_v2, anchor_mode: uniform, n_theta_anchors: 6, seed: 2}
