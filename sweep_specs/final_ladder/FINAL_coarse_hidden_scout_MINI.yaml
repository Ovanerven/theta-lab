# Phase 0.5 — per-scaffold HIDDEN scan, ALL scaffolds, 3 SEEDS each (coarse is cheap + GPU has room).
# Locked recipe for everyone: nn_gru / nsub3 / pulse / PLAIN / coarse. Scaffold-intrinsic only:
#   M3, M5         -> real-only, {new:1}
#   M9_dark        -> real-only, {new:1}, + lambda_oxygen 0.1, lr 0.0015 (lr-fragile)
#   M7_bg, M8_bg   -> coarse-COMBINED + synth (synth:1.0) + L_zero 0.005 + balance + test_real_only
# Scaffold-appropriate hidden grids: M3 {200,300,400}, M5 {400,600,800}, M9/M7/M8 {400,600}.
# 12 configs x 3 seeds = 36 runs. Seeded means (beats the ±0.05 noise) -> pick best hidden -> ladder.
#
# Launch (box, plenty of VRAM):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_hidden_scout_all.yaml \
#     --local --max-parallel 7 --out-root experiments_final/experiments

study: FINAL_coarse_hidden_scout_MINI
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  # PLAIN loss (locked) for everyone
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

# real-only (M3, M5)
_real: &real
  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  source_loss_weights: {new: 1.0, old: 1.0}

# M9 oxygen extras (merged with *real)
_m9oxy: &m9oxy
  lr: 0.0015
  lambda_oxygen: 0.1
  oxygen_protein_channel: 5
  oxygen_u_open_name: u_open

# M7/M8: coarse-combined + full synth + L_zero
_combined: &combined
  dataset_path: datasets/cell-free/txtl_native_combined_coarsenold.npz
  use_synthetic_data: true
  test_real_only: true
  balance_source_sampler: true
  lambda_zero_traj: 0.005
  source_loss_weights: {new: 1.0, old: 1.0, synth: 1.0}

runs:
  - {exp_name: HSa_M3_h200_s0, seed: 0, scaffold: txtl_model3_two_state, hidden: 200, <<: *real}
  - {exp_name: HSa_M3_h200_s1, seed: 1, scaffold: txtl_model3_two_state, hidden: 200, <<: *real}
  - {exp_name: HSa_M3_h200_s2, seed: 2, scaffold: txtl_model3_two_state, hidden: 200, <<: *real}
  - {exp_name: HSa_M3_h300_s0, seed: 0, scaffold: txtl_model3_two_state, hidden: 300, <<: *real}
  - {exp_name: HSa_M3_h300_s1, seed: 1, scaffold: txtl_model3_two_state, hidden: 300, <<: *real}
  - {exp_name: HSa_M3_h300_s2, seed: 2, scaffold: txtl_model3_two_state, hidden: 300, <<: *real}
  - {exp_name: HSa_M3_h400_s0, seed: 0, scaffold: txtl_model3_two_state, hidden: 400, <<: *real}
  - {exp_name: HSa_M3_h400_s1, seed: 1, scaffold: txtl_model3_two_state, hidden: 400, <<: *real}
  - {exp_name: HSa_M3_h400_s2, seed: 2, scaffold: txtl_model3_two_state, hidden: 400, <<: *real}
  - {exp_name: HSa_M9_h400_s0, seed: 0, scaffold: txtl_model9_dark_stable, hidden: 400, <<: [*real, *m9oxy]}
  - {exp_name: HSa_M9_h400_s1, seed: 1, scaffold: txtl_model9_dark_stable, hidden: 400, <<: [*real, *m9oxy]}
  - {exp_name: HSa_M9_h400_s2, seed: 2, scaffold: txtl_model9_dark_stable, hidden: 400, <<: [*real, *m9oxy]}
  - {exp_name: HSa_M9_h600_s0, seed: 0, scaffold: txtl_model9_dark_stable, hidden: 600, <<: [*real, *m9oxy]}
  - {exp_name: HSa_M9_h600_s1, seed: 1, scaffold: txtl_model9_dark_stable, hidden: 600, <<: [*real, *m9oxy]}
  - {exp_name: HSa_M9_h600_s2, seed: 2, scaffold: txtl_model9_dark_stable, hidden: 600, <<: [*real, *m9oxy]}
