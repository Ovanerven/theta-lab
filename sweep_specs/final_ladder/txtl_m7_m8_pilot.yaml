# M7 + M8 pilot — 50 epochs, two datasets, K-bound sweep for M8.
#
# Purpose: validate that M7 and M8 train properly on both data regimes before
# committing to the expensive full sweep (to be run locally).
#
# Scaffold fix committed in this branch:
#   M7: K_T7..K_K theta_hi  1e2 → 1.0
#   M8: K_E..K_W  theta_hi  1e2 → 1.0
# Root cause: 6-gate MM product initialised near 0 → vanishing gradient on
# translation → protein stuck at ~20 loss for all 100 epochs.
#
# For M8 we also test theta_hi_override: {6..11: 0.1} (one seed per bound).
# K_hi=1.0 inits K≈0.01 → f(X=0.3)≈0.97,  product-of-6 ≈ 0.82
# K_hi=0.1 inits K≈0.004 → f(X=0.3)≈0.99, product-of-6 ≈ 0.92
# Both should fix the dead-gate problem; this tells us if 1.0 is tight enough.
#
# For M7 two seeds are kept (no bound sweep needed — M7 already trains, just
# confirming it converges on the larger / combined-synth datasets).
#
# Timing (A100):
#   old-only  (691 samples):  ~33s/ep × 50 = ~28 min  → ~59 SBU/run
#   combined (3499 samples): ~120s/ep × 50 = ~100 min → ~213 SBU/run
#
# SBU budget:
#   M7: 4 runs × avg 136 = ~544 SBU
#   M8: 4 runs × avg 136 = ~544 SBU
#   Total: ~1088 SBU  (15 % of remaining 7101 SBU)

study: txtl_m7_m8_pilot
runs_per_job: 1
time: "02:30:00"
partition: gpu_h100
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 50
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  ckpt_every: 0

runs:
  # ═══════════════════════════════════════════════════════════════════════════
  # M7 — BoundaryGatedScaffold
  # Re-enabled to test the FB→NTPs scaffold fix (scaffolds.py:1007). Previously
  # 75% of old samples (and 15% of combined) had NTPs=0 → g_NTP=0 → g_expr=0
  # → pm chain dead. With FB mapped to state 7, every sample now receives NTPs
  # via either explicit NTPs control or the FB feed buffer.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── M7 OLD native only (691 real, no synth) ───────────────────────────────
  - exp_name: M7_old_s1
    scaffold: txtl_model7_boundary_gated
    seed: 1
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

  - exp_name: M7_old_s2
    scaffold: txtl_model7_boundary_gated
    seed: 2
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

  # ── M7 COMBINED (691 old + 312 new + 2496 synth = 3499) ───────────────────
  - exp_name: M7_comb_s1
    scaffold: txtl_model7_boundary_gated
    seed: 1
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
    plot_extra_new_samples: 5
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

  - exp_name: M7_comb_s2
    scaffold: txtl_model7_boundary_gated
    seed: 2
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
    plot_extra_new_samples: 5
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # M8 — ReagentResourceScaffold (sparse-K=1)
  # Two K-hi values tested per dataset: scaffold default (1.0) vs override (0.1)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── M8 OLD native only ────────────────────────────────────────────────────
  # COMMENTED OUT: M8_old_Khi1p0 and Khi0p1 are already running cleanly
  # (job 23104970/23104971, ep42 with pm≈8.4 declining). No need to rerun.
  #
  # - exp_name: M8_old_Khi1p0
  #   scaffold: txtl_model8_reagent_resource
  #   seed: 1
  #   model_class: ode_rnn_sparse_theta_v2
  #   anchor_mode: uniform
  #   n_theta_anchors: 1
  #   dataset_path: datasets/cell-free/txtl_native_old_only.npz
  #   val_n: 87
  #   test_n: 87
  #   stratify_z_expr: false
  #   test_real_only: false
  #   stratified_split: true
  #   stratify_targets: [3, 5]
  #   stratify_bins: 5
  #   stratify_by_source: true
  #
  # - exp_name: M8_old_Khi0p1
  #   scaffold: txtl_model8_reagent_resource
  #   seed: 1
  #   model_class: ode_rnn_sparse_theta_v2
  #   anchor_mode: uniform
  #   n_theta_anchors: 1
  #   dataset_path: datasets/cell-free/txtl_native_old_only.npz
  #   val_n: 87
  #   test_n: 87
  #   stratify_z_expr: false
  #   test_real_only: false
  #   stratified_split: true
  #   stratify_targets: [3, 5]
  #   stratify_bins: 5
  #   stratify_by_source: true
  #   theta_hi_override: {6: 0.1, 7: 0.1, 8: 0.1, 9: 0.1, 10: 0.1, 11: 0.1}

  # ── M8 COMBINED — 5-epoch NaN-test with n_substeps=2 ──────────────────────
  # Previous M8_comb runs NaN'd at ep1 with n_substeps=1. This pilot tests
  # whether n_substeps=2 stabilises integration on the combined dataset
  # (which has wider reagent-bolus magnitudes than old_only). Reduced to 5
  # epochs since this is a stability test, not a convergence test — if ep1-5
  # all show finite loss, we know n_substeps=2 fixes the NaN and can launch
  # the 50-epoch full M8_comb runs separately.
  - exp_name: M8_comb_Khi1p0_nsub2
    scaffold: txtl_model8_reagent_resource
    seed: 1
    model_class: ode_rnn_sparse_theta_v2
    anchor_mode: uniform
    n_theta_anchors: 1
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
    plot_extra_new_samples: 5
    epochs: 5
    n_substeps: 2

  - exp_name: M8_comb_Khi0p1_nsub2
    scaffold: txtl_model8_reagent_resource
    seed: 1
    model_class: ode_rnn_sparse_theta_v2
    anchor_mode: uniform
    n_theta_anchors: 1
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
    plot_extra_new_samples: 5
    theta_hi_override: {6: 0.1, 7: 0.1, 8: 0.1, 9: 0.1, 10: 0.1, 11: 0.1}
    epochs: 5
    n_substeps: 2
