# Lock the M4 config: best variant (nn_gru) × the two contender losses (plain vs lateP-only),
# seeded, to (a) pin nn_gru's old/new means and (b) settle the last untested loss (lateP-only:
# JUST second-half protein upweight, no mRNA species-weight, no endpoint anchor).
# Anchor: M4 / h300 / nsub3 / pulse / coarse / {new:1} / 200ep. 2 losses × 4 seeds = 8 runs.
#
# Context: nn_gru is the balanced champion (old ~0.69 reaching 0.735, new ~0.41 reaching 0.51).
# plain = best-supported loss on protein so far. lateP-only = soft/distributed endpoint focus,
# untested — might lift protein without the endpoint anchor's mean-regression.
#
# Launch (laptop / mini):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_nngru_finalize.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_coarse_nngru_finalize
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru            # the best-old / balanced variant
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  use_ivtt_mse_loss: false
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # nn_gru × PLAIN × 4 seeds (no loss shaping)
  - {exp_name: NG_plain_s0, seed: 0, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_plain_s1, seed: 1, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_plain_s2, seed: 2, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_plain_s3, seed: 3, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0}

  # nn_gru × lateP-only × 4 seeds (ONLY second-half protein upweight)
  - {exp_name: NG_lateP_s0, seed: 0, species_weights: null, time_upweight: {5: [0.5, 3.0]}, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_lateP_s1, seed: 1, species_weights: null, time_upweight: {5: [0.5, 3.0]}, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_lateP_s2, seed: 2, species_weights: null, time_upweight: {5: [0.5, 3.0]}, endpoint_channels: null, lambda_endpoint: 0.0}
  - {exp_name: NG_lateP_s3, seed: 3, species_weights: null, time_upweight: {5: [0.5, 3.0]}, endpoint_channels: null, lambda_endpoint: 0.0}
