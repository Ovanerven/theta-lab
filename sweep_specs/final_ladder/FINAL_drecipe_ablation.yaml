# D-recipe ablation: did adding species_weights + time_upweight + endpoint_channels
# kill M5's old-data fit and dilute the new-upweight on M3?
#
# Canonical M5_real_s0 (partial d-recipe, no new-upweight):    R²(p) = 0.407
# FINAL    M5_real_s0 (full d-recipe + 5x new-upweight):       R²(p) = 0.176   ← regression
#
# Hypothesis: the per-channel/per-time multipliers in species_weights and
# time_upweight numerically swamp the {new:5, old:1} source upweight, so
# the upweight effectively dilutes to nothing AND the loss-shape change
# destabilizes M5.
#
# Test: M3 and M5 real-only with MINIMAL d-recipe + 5x new-upweight.
# If both recover/improve vs FINAL_dense_theta_seeds, minimal is better
# and we should strip full d-recipe from the canonical recipe.
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_drecipe_ablation.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_drecipe_ablation
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_real_only_overrides: &real
  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  source_loss_weights:
    new: 5.0
    old: 1.0

fixed:
  epochs: 100
  warmup_epochs: 5
  hidden: 600
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  y0_theta_init: false
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5

  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  test_real_only: true
  balance_source_sampler: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # ── MINIMAL d-recipe (matches B_loss_upweight5x that achieved 0.409) ──
  # NO species_weights, NO time_upweight, NO endpoint_channels.
  use_ivtt_mse_loss: false
  lambda_endpoint: 0.1
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

  source_loss_weights:
    new: 5.0
    old: 1.0
    synth: 0.05

runs:
  - {exp_name: M3_real_minrecipe_s0, scaffold: txtl_model3_two_state,            seed: 0, n_substeps: 1, <<: *real}
  - {exp_name: M5_real_minrecipe_s0, scaffold: txtl_resource_and_maturation_dna, seed: 0, n_substeps: 1, <<: *real}
