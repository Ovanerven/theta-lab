# SGDR on the LSTM encoder — the +SGDR column for the encoder table.
# Identical Table 5.8 recipe (M4 / h400 / nsub3 / pulse_cumsum_sqrt / 200 ep, NO endpoint
# supervision), so the ADAM BASELINE is the existing experiments_final EZ_lstm runs — not
# re-run here. SGDR-only: LSTM × SGDR(T_0=40) × {s0,s1,s2} = 3 runs.
# Completes the encoder set alongside:
#   FINAL_encoder_sgdr_transformer_mamba.yaml  (Transformer + Mamba)
#   FINAL_slstm_sgdr_verify.yaml               (sLSTM + GRU)
#
# LSTM = model_class lstm_rnn, slstm_drop_last_layer: false (matches the EZ_lstm arm in
# FINAL_coarse_encoder_zoo_light.yaml that produced the Table 5.8 LSTM row).
# Requires the train.py SGDR additions (warm_restarts/restart_period) on the run machine.
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_encoder_sgdr_lstm.yaml --local --max-parallel 3

study: FINAL_encoder_sgdr_lstm
runs_per_job: 1
time: "02:00:00"
partition: gpu_h100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 400
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  lmu_memory: 64
  lmu_theta: 324
  y_transform: sqrt_clamp1
  d_state: 16
  expand: 2
  d_conv: 4
  context_len: 64
  tf_group_size: 32
  ar_gap: 4
  ff_mult: 2
  autocast_bf16: false
  jit_scripting: true
  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

_lstm: &lstm {model_class: lstm_rnn, slstm_drop_last_layer: false}

runs:
  # ── LSTM — SGDR (T_0=40) ───────────────────────────────────────────────────
  - {exp_name: ESL_lstm_SGDR_s0, seed: 0, <<: *lstm, warm_restarts: true, restart_period: 40}
  - {exp_name: ESL_lstm_SGDR_s1, seed: 1, <<: *lstm, warm_restarts: true, restart_period: 40}
  - {exp_name: ESL_lstm_SGDR_s2, seed: 2, <<: *lstm, warm_restarts: true, restart_period: 40}
