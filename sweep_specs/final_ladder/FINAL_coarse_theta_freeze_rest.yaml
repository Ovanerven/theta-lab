# θ-FREEZE RETRAIN — fill the REST of the gating table (the 3 params not yet retrained).
#
# FINAL_coarse_theta_freeze.yaml did v_TX (θ0) and k_mat (θ3). This adds the other three so the
# retrain column is complete for all 5 M4 parameters:
#   FZ_vTL   (θ1)  v_TL   — translation rate
#   FZ_kM    (θ2)  k_M    — mRNA degradation rate
#   FZ_kdegp (θ4)  k_degp — protein degradation rate
#
# Identical mechanism + recipe to FINAL_coarse_theta_freeze.yaml (locked NG_plain M4: nn_gru / h300 /
# nsub3 / pulse_cumsum_sqrt / coarse real-only), so head-to-head with the same NG_plain baseline and
# the existing v_TX/k_mat freeze runs. pin_theta collapses the param's (lo,hi) box to a constant.
#
# Pin = cross-seed grand-mean of the trained NG_plain emitted θ (same definition as the existing pins;
# verified my recompute reproduces v_TX 1.999e-3≈0.00194 and k_mat 3.254e-5≈3.16e-5):
#   v_TL -> 2.29e-3,  k_M -> 2.43e-4,  k_degp -> 3.11e-4.
#
# 3 params x 4 seeds (0-3) = 12 runs.
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_theta_freeze_rest.yaml \
#     --local --max-parallel 2 --out-root experiments_final/experiments

study: FINAL_coarse_theta_freeze_rest
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml
fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  cosine_decay: false
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  encoder_use_time: false
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1
  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # (3) freeze v_TL (θ1, translation rate)
  - {exp_name: FZ_vTL_s0,   seed: 0, pin_theta: {1: 2.29e-3}}
  - {exp_name: FZ_vTL_s1,   seed: 1, pin_theta: {1: 2.29e-3}}
  - {exp_name: FZ_vTL_s2,   seed: 2, pin_theta: {1: 2.29e-3}}
  - {exp_name: FZ_vTL_s3,   seed: 3, pin_theta: {1: 2.29e-3}}
  # (4) freeze k_M (θ2, mRNA degradation rate)
  - {exp_name: FZ_kM_s0,    seed: 0, pin_theta: {2: 2.43e-4}}
  - {exp_name: FZ_kM_s1,    seed: 1, pin_theta: {2: 2.43e-4}}
  - {exp_name: FZ_kM_s2,    seed: 2, pin_theta: {2: 2.43e-4}}
  - {exp_name: FZ_kM_s3,    seed: 3, pin_theta: {2: 2.43e-4}}
  # (5) freeze k_degp (θ4, protein degradation rate)
  - {exp_name: FZ_kdegp_s0, seed: 0, pin_theta: {4: 3.11e-4}}
  - {exp_name: FZ_kdegp_s1, seed: 1, pin_theta: {4: 3.11e-4}}
  - {exp_name: FZ_kdegp_s2, seed: 2, pin_theta: {4: 3.11e-4}}
  - {exp_name: FZ_kdegp_s3, seed: 3, pin_theta: {4: 3.11e-4}}
