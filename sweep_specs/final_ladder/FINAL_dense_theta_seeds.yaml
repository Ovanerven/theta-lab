  #   M7_bg synth=0.05 → R²(p)=0.325 (old=0.465)   ← synth-downweight HURTS M7
  # Keep synth=1.0 as the canonical M7_bg combined recipe going forward.

  # ── M8_bg combined A/B: synth=1.0 vs synth=0.05, both with L_zero ────────
