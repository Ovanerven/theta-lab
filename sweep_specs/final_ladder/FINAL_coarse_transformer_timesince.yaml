# Transformer + per-bolus recency on coarse, FULL attention window.
# Hypothesis: the transformer underperforms GRU because cumsum_sqrt hides per-bolus
# timing (a monotone staircase), and the transformer — unlike the GRU's recurrence —
# has no implicit recency bias. cumsum_timesince_sqrt adds log1p(time-since-each-bolus)
# as a second channel per u col, giving it magnitude + recency explicitly.
#
# Coarse K=324 → context_len=384 covers the whole trajectory (full attention, not sliding).
# Reference arm: same model/window on plain cumsum_sqrt, so any delta isolates the FEATURE
# from the wider WINDOW. Anchor mirrors FINAL_coarse_encoder_swap (M4 / h300 / nsub3).
#
# Launch (box):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_transformer_timesince.yaml \
#     --local --max-parallel 2 --out-root experiments_final/experiments

study: FINAL_coarse_transformer_timesince
runs_per_job: 1
time: "01:20:00"
partition: gpu_h100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 100
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  y_transform: sqrt_clamp1
  model_class: ode_transformer
  # transformer params — FULL window (K=324 < 384)
  context_len: 384
  tf_group_size: 32
  ar_gap: 4
  ff_mult: 2
  autocast_bf16: true               # flash attention
  grad_checkpoint: true             # full-window 324-step graph is memory-heavy; recompute in backward

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # NEW: per-bolus recency feature, full window
  - {exp_name: TS_timesince_full_s0, seed: 0, u_transform: cumsum_timesince_sqrt}
  - {exp_name: TS_timesince_full_s1, seed: 1, u_transform: cumsum_timesince_sqrt}
  - {exp_name: TS_timesince_full_s2, seed: 2, u_transform: cumsum_timesince_sqrt}
  # REFERENCE: same model + full window, plain cumsum_sqrt (isolates feature vs window)
  - {exp_name: TS_cumsumsqrt_full_s0, seed: 0, u_transform: cumsum_sqrt}
  - {exp_name: TS_cumsumsqrt_full_s1, seed: 1, u_transform: cumsum_sqrt}
  - {exp_name: TS_cumsumsqrt_full_s2, seed: 2, u_transform: cumsum_sqrt}
