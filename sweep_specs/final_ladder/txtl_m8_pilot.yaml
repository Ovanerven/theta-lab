# M8 pilot — 50 epochs, testing the K-bound fix on two data regimes.
#
# Root cause of M8 failure (diagnosed from 100-epoch ladder):
#   v_TL = alpha_TL * (m+mm) * f_A * f_E * f_Mg * f_K * f_C * f_W
#   6 compounded MM gates, each in [1e-4, 1e2] → product collapses to ~0 at init,
#   gradient w.r.t. each K is O(0.1^5) ≈ 1e-5 → all K constants frozen → protein
#   stays at zero for all 100 epochs (pm loss 23→20, R²≈-0.63).
#
# Fix: cap K_E..K_W theta_hi at 1.0 (was 1e2) so gates initialize near saturation
#   (f ≈ 0.98 per gate, product ≈ 0.89) giving strong gradients from epoch 1.
#   The model can still push K up if needed to reduce efficiency.
#
# Uses sparse_theta_v2 / K=1 (consistent with ladder; dense M8 collapses historically).
#
# Timing estimates (A100):
#   old  : ~33s/ep × 50 = ~28 min per run  →  ~59 SBU each
#   comb : ~120s/ep × 50 = ~100 min per run → ~213 SBU each
# Total: 2×59 + 2×213 ≈ 544 SBU
#
# Pass criterion at ep50: pm loss clearly dropping (below 5.0), R²(protein) > -0.3.
# Fail: pm loss stuck near 20 (same as unfixed M8).

study: txtl_m8_pilot
runs_per_job: 1
time: "02:30:00"
partition: gpu_a100
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 50
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  scaffold: txtl_model8_reagent_resource
  model_class: ode_rnn_sparse_theta_v2
  anchor_mode: uniform
  n_theta_anchors: 1
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  ckpt_every: 0                        # no intermediate checkpoints (disk)

runs:
  # ── OLD native only — real data only ───────────────────────────────────────
  - exp_name: M8_old_s1
    seed: 1
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true

  - exp_name: M8_old_s2
    seed: 2
    dataset_path: datasets/cell-free/txtl_native_old_only.npz
    val_n: 87
    test_n: 87
    stratify_z_expr: false
    test_real_only: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true

  # ── Combined (old + new + synth) — synthetic data included ─────────────────
  - exp_name: M8_comb_s1
    seed: 1
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]  # excludes DNA c(2), is_new(12), u_open(13)
    plot_extra_new_samples: 5

  - exp_name: M8_comb_s2
    seed: 2
    dataset_path: datasets/cell-free/txtl_native_combined.npz
    val_n: 125
    test_n: 125
    test_real_only: true
    stratify_z_expr: false
    stratified_split: true
    stratify_targets: [3, 5]
    stratify_bins: 5
    stratify_by_source: true
    balance_source_sampler: true
    gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
    plot_extra_new_samples: 5
