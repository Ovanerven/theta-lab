# Push OLD R² to >=0.7 on the balanced coarse setup, via integration precision.
# The coarse old-R² gap (~0.66 vs native 0.76) is high-yield-sample integration error on the
# 600s tail. n_substeps = finer RK4 on the SAME unified grid → recovers old fidelity WITHOUT
# re-introducing grid mismatch or hurting new. Loss = PLAIN (had the best old in the decomp:
# 0.677 vs HY 0.642). Anchor: M4 / h300 / pulse / coarse / {new:1} / 200ep.
#
# nsub {3,5,7} × seeds {0,1,2}. Watch the OLD column climb toward 0.7 as nsub rises (and where
# it saturates). Best single coarse run already hit old 0.718 — the seeded mean is the target.
#
# Launch (mac mini / laptop):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_nsub_ladder.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_coarse_nsub_ladder
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  gru_variant: stacked_cell
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # PLAIN loss (best old in the decomposition)
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  - {exp_name: NS_nsub3_s0, seed: 0, n_substeps: 3}
  - {exp_name: NS_nsub3_s1, seed: 1, n_substeps: 3}
  - {exp_name: NS_nsub3_s2, seed: 2, n_substeps: 3}
  - {exp_name: NS_nsub5_s0, seed: 0, n_substeps: 5}
  - {exp_name: NS_nsub5_s1, seed: 1, n_substeps: 5}
  - {exp_name: NS_nsub5_s2, seed: 2, n_substeps: 5}
  - {exp_name: NS_nsub7_s0, seed: 0, n_substeps: 7}
  - {exp_name: NS_nsub7_s1, seed: 1, n_substeps: 7}
  - {exp_name: NS_nsub7_s2, seed: 2, n_substeps: 7}
