# Neural-ODE BASELINES @ hidden=400 — black-box / UDE rungs vs the mechanistic
# ladder. Same loss / hyperparams / data / split as the scaffold-ladder *real
# runs (FINAL_coarse_hidden_scout_all.yaml: lr=0.002, plain loss, real coarse,
# obs [3,5], n_substeps=3) — only the capacity differs. Without mechanistic
# structure the black-box field needs more width, so this sweep (and the h600
# sibling) raise hidden above the M4 flagship's 300.
#
#   neural_ode_mlp         ẋ = MLP(x,u)                 black-box, no mechanism
#   neural_ode_gru         ODE-RNN GRU encoder           black-box dynamics
#   neural_ode_correction  ẋ = f_mech(x,θ_global)+f_NN(x)  UDE on the M4 mechanism
#
# Feature caveat: MLP/GRU don't support pulse_cumsum_sqrt (channel-expanding) →
# cumsum_sqrt; correction has no encoder so u_transform is moot. Same fair-feature
# caveat as the transformer/mamba arms. scaffold=M4 (mechanism for corr; shape for MLP/GRU).
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_node_baselines_h400.yaml --local --max-parallel 1

study: FINAL_coarse_node_baselines_h400
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 400
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  nn_hidden: 400
  nn_layers: 2
  theta_lo: 1.0e-06
  theta_hi: 2.0
  theta_head_tau: 2.3
  encoder_use_log_dt: true
  u_transform: cumsum_sqrt
  y_transform: sqrt_clamp1
  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  - {exp_name: NODE_mlp_h400_s0,  seed: 0, model_class: neural_ode_mlp}
  - {exp_name: NODE_mlp_h400_s1,  seed: 1, model_class: neural_ode_mlp}
  - {exp_name: NODE_mlp_h400_s2,  seed: 2, model_class: neural_ode_mlp}
  - {exp_name: NODE_gru_h400_s0,  seed: 0, model_class: neural_ode_gru}
  - {exp_name: NODE_gru_h400_s1,  seed: 1, model_class: neural_ode_gru}
  - {exp_name: NODE_gru_h400_s2,  seed: 2, model_class: neural_ode_gru}
  - {exp_name: NODE_corr_h400_s0, seed: 0, model_class: neural_ode_correction}
  - {exp_name: NODE_corr_h400_s1, seed: 1, model_class: neural_ode_correction}
  - {exp_name: NODE_corr_h400_s2, seed: 2, model_class: neural_ode_correction}
