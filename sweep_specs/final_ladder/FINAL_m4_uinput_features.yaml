# Input-feature ladder for M4 — does making the bolus signal PERSIST (with timing)
# beat instantaneous pulses?  Tests the dynamic-range-compression hypothesis from
# scripts/diag_failures.py: the encoder hedges pm toward a central band because the
# recipe (early boluses) must be memorized across ~1150 zero-input steps and is lost.
#
# BASELINE (do NOT re-run): FINAL_m4_squeeze / M4sq_07_drecipe_ref_s0
#   = this exact config with u_transform: sqrt  (pm 0.663 overall / 0.759 old — best M4 so far).
# These 3 arms differ from it in ONLY u_transform. Raw u still drives the ODE bolus
# jumps; u_transform is encoder-only (ode_rnn reads self.u_transform), mechanism untouched.
#
# Arms (new encoder features, all dt-aware):
#   1. pulse_cumsum_sqrt     [sqrt(pulse), sqrt(cumsum)]    — exact event timing+mag AND persistent recipe (2x cols)
#   2. cumsum_timesince_sqrt [sqrt(cumsum), log1p(t_since)] — persistent magnitude AND per-channel recency (2x cols)
#   3. decay_trace           3 leaky integrators τ=300/3600/36000s — magnitude+recency at fast→persistent scales (3x cols)
#
# Read each with: python scripts/diag_failures.py <run_dir>  → compare the [2] magnitude-tercile
# bias (esp. high tercile, currently -522) and pm_old / pm_new against M4sq_07.
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_m4_uinput_features.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_m4_uinput_features
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_real_only_overrides: &real
  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  source_loss_weights:
    new: 5.0
    old: 1.0

fixed:
  # ── identical to M4sq_07_drecipe_ref_s0 training setup ──
  epochs: 100
  warmup_epochs: 5
  hidden: 400
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  n_substeps: 1
  y0_theta_init: false
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5
  dropout: 0.2
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  test_real_only: true
  balance_source_sampler: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # ── d-recipe loss (the best-M4 recipe) ──
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  endpoint_loss_space: log
  lambda_peak: 0.0
  peak_channels: null
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

  source_loss_weights:
    new: 5.0
    old: 1.0

runs:
  # 0. plain persistence baseline — running total, NO timing/recency (the simplest fix).
  #    Establishes what cumsum buys ALONE, so arms 1-3 show what timing ADDS on top.
  - {exp_name: M4_uf_cumsum_s0,         seed: 0, u_transform: cumsum_sqrt,           <<: *real}

  # 1. exact event timing+magnitude  AND  persistent running recipe
  - {exp_name: M4_uf_pulse_cumsum_s0,   seed: 0, u_transform: pulse_cumsum_sqrt,     <<: *real}

  # 2. persistent magnitude  AND  per-channel time-since-last-event (incl. time-since-u_open)
  - {exp_name: M4_uf_cumsum_timesince_s0, seed: 0, u_transform: cumsum_timesince_sqrt, <<: *real}

  # 3. multi-timescale leaky integrators (magnitude + recency, fast→persistent)
  - {exp_name: M4_uf_decay_trace_s0,    seed: 0, u_transform: decay_trace,           <<: *real}
