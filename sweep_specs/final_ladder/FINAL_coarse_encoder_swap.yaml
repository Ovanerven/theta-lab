# Encoder swap on coarse: GRU vs mambapy vs transformer, at M4's best config.
# RUN AFTER nngru_finalize confirms the config. mambapy/transformer don't support pulse, so all
# arms use cumsum_sqrt (grid-invariant), with a GRU cumsum_sqrt REFERENCE for a fair 3-way test.
# Transformer is now feasible on coarse (~283 steps) — sliding-window + flash attention.
# Anchor: M4 / h300 / nsub3 / cumsum_sqrt / plain / coarse / {new:1} / 200ep. 3 encoders × 3 seeds.
#   (loss=plain placeholder; swap to lateP if nngru_finalize says so — one-line edit.)
#
# Launch (box, after nngru_finalize):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_encoder_swap.yaml \
#     --local --max-parallel 2 --out-root experiments_final/experiments

study: FINAL_coarse_encoder_swap
runs_per_job: 1
time: "00:50:00"
partition: gpu_h100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 100
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: cumsum_sqrt          # shared grid-invariant feature (mamba/transformer can't do pulse)
  y_transform: sqrt_clamp1
  # mamba params (ignored by GRU/transformer)
  d_state: 16
  expand: 2
  d_conv: 4
  # transformer params
  context_len: 64                   # sliding-window attention
  tf_group_size: 32
  ar_gap: 4
  ff_mult: 2
  autocast_bf16: true               # flash attention

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # plain loss (placeholder — swap to lateP if nngru_finalize wins on that)
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # - {exp_name: ES_transformer_s0, seed: 0, model_class: ode_transformer}
  - {exp_name: ES_transformer_s1, seed: 1, model_class: ode_transformer}
  # - {exp_name: ES_transformer_s2, seed: 2, model_class: ode_transformer}

