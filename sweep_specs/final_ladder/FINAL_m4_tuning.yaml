# M4 tuning sweep — seed 0 only. Isolates loss recipe + hidden + lr around the
# current "winning combo" (H400, epochs 200, lr 0.0015), all on the VANILLA
# (plain) loss — equal channel weighting, no d-recipe shaping.
#
# Motivation: at matched hparams, plain ≥ d-recipe for M4 on every metric
# (plain old-protein 0.735 vs d-recipe 0.703; plain mRNA 0.514 vs 0.453).
# So d-recipe is dropped. These runs probe whether (a) a mild 2x late-protein
# upweight helps without the rest of d-recipe, (b) lr 0.0018, (c) hidden 350.
#
# VANILLA = plain loss:
#   species_weights: null   time_upweight: null   endpoint_channels: null
#   (kept: loss_normalizer_channels=3, loss_clamp_min=1.0, source upweight {new:5,old:1})
#
# 4 runs, all M4 (txtl_model4_three_state), real-only, seed 0:
#   1. M4_vanilla_h400_lr0015         ← the winning combo on plain loss (baseline)
#   2. M4_vanilla_2xlateP_h400_lr0015 ← + ONLY 2x late-protein upweight
#   3. M4_vanilla_h400_lr0018         ← lr 0.0018 variant
#   4. M4_vanilla_h350_lr0015         ← hidden 350 variant
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_m4_tuning.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_m4_tuning
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_real_only_overrides: &real
  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  source_loss_weights:
    new: 5.0
    old: 1.0

fixed:
  # ── winning-combo training setup ──────────────────────────────────────────
  epochs: 200
  warmup_epochs: 5
  hidden: 400
  lr: 0.0015
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  n_substeps: 1
  y0_theta_init: false
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5
  dropout: 0.2

  # feature transforms (same as the winning h400 run)
  u_transform: sqrt
  y_transform: sqrt_clamp1

  # dataset / split (real-only via *real per run)
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  test_real_only: true
  balance_source_sampler: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # ── VANILLA loss: equal channel weighting, no shaping ─────────────────────
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.1            # no-op while endpoint_channels is null
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

  source_loss_weights:
    new: 5.0
    old: 1.0

runs:
  # 1. Winning combo on vanilla loss — baseline
  - {exp_name: M4_vanilla_h400_lr0015_s0, seed: 0, <<: *real}

  # 2. Vanilla + ONLY a 2x late-protein upweight (channel 5, t >= 0.5*length)
  - exp_name: M4_vanilla_2xlateP_h400_lr0015_s0
    seed: 0
    time_upweight:
      5: [0.5, 2.0]
    <<: *real

  # 3. lr 0.0018 variant
  - {exp_name: M4_vanilla_h400_lr0018_s0, seed: 0, lr: 0.0018, <<: *real}

  # 4. hidden 350 variant
  - {exp_name: M4_vanilla_h350_lr0015_s0, seed: 0, hidden: 350, <<: *real}
