# Combined feature: pulse_cumsum_timesince = magnitude + persistence + recency.
#
# WHY: on coarse, pulse (magnitude) is the OLD champion (old 0.608) and timesince
# (recency) is the NEW champion (new 0.556) — but each wins only HALF the frontier:
#   pulse drops recency (new ~0.40); timesince drops the instantaneous magnitude old
#   needs (old collapses to ~0.17). The union keeps BOTH channels: old keeps its
#   magnitude, new gets its recency. Tests whether we can hold old AND new at once.
#
# Also re-tests CAPACITY: with compression reduced (model no longer just predicting
# the mean), larger hidden may finally pay off — so M4/M5 at BOTH h400 and h600.
#
# All arms: COARSENED real-only + pulse_cumsum_timesince + {new:1} + d-recipe.
# Compare against (same grid/recipe/weight):
#   CO_M4_h400 (pulse): pm 0.611/old 0.672/new 0.329   [d-recipe scaffold sweep]
#   M4_co_pulse_new1:   pm 0.577/old 0.608/new 0.395    [100ep coarsenold sweep]
#   M4_co_timesince_new2: new 0.556 (old 0.223)         [new champion, old collapse]
#   CO_M5_h400/h600 (pulse): old 0.63-0.66 / new 0.39-0.44
#
# Launch (GPU):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_pulsetimesince.yaml \
#     --out-root experiments_final/experiments

study: FINAL_coarse_pulsetimesince
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  n_substeps: 1
  y0_theta_init: false
  encoder_use_log_dt: true
  plot_extra_new_samples: 5
  dropout: 0.2
  u_transform: pulse_cumsum_timesince
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # d-recipe
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  endpoint_loss_space: log
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  - {exp_name: PT_M4_h400_s0, seed: 0, scaffold: txtl_model4_three_state,          hidden: 400}
  - {exp_name: PT_M4_h600_s0, seed: 0, scaffold: txtl_model4_three_state,          hidden: 600}
  - {exp_name: PT_M5_h400_s0, seed: 0, scaffold: txtl_resource_and_maturation_dna, hidden: 400}
  - {exp_name: PT_M5_h600_s0, seed: 0, scaffold: txtl_resource_and_maturation_dna, hidden: 600}
