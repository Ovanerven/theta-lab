# Transformer ablation on coarse — stage in three architectural fixes one at a time.
#
# Baseline ref: FINAL_coarse_encoder_swap ES_transformer_s1 (window-relative pos,
# no checkpoint, no time feature) → val diverged after ep 40, mm channel collapsed
# to a constant from ep 67 onward, R²(mRNA max) = -0.61.
#
# Stages:
#   A — absolute pos embed   (free; gives the model absolute trajectory position)
#   B — A + gradient checkpoint  (memory cut; checkpoint per-step transformer call)
#   C — B + time-since-bolus feature  (continuous time scalar appended to encoder input)
#   D — C + pulse_cumsum_sqrt feature  (the winning GRU feature, now ported to the transformer:
#         [sqrt(pulse), sqrt(cumsum)] = 2x u cols — exact event timing+magnitude AND persistent
#         recipe. The biggest expected gain; free on speed. Window still 64.)
#   E — D + FULL-sequence attention  (context_len=512 > seq ~283, so the window never truncates;
#         the model can attend back to the t=0 bolus directly. ~7.7x attention FLOPs, but memory
#         is fine — peak attn buffers ~190MB. RUN THIS ON THE BOX, not MPS.)
#   F — C + full-window WITHOUT pulse  (cumsum_sqrt + full attention — isolates the window
#         contribution from the feature contribution, so D vs F attributes the gain.)
#
# Same single seed (s1) as the original encoder_swap run so results are directly comparable.
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_transformer_ablation.yaml \
#     --local --max-parallel 2 --out-root experiments_final/experiments

study: FINAL_transformer_ablation
runs_per_job: 1
time: "00:02:00"
partition: gpu_h100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: cumsum_sqrt
  y_transform: sqrt_clamp1
  # mamba params (ignored by transformer)
  d_state: 16
  expand: 2
  d_conv: 4
  # transformer base params
  context_len: 64
  tf_group_size: 32
  ar_gap: 4
  ff_mult: 2
  autocast_bf16: true
  max_seq_len: 512                  # absolute-pos embedding table size
  model_class: ode_transformer

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # Stage A: absolute pos only
  # - exp_name: TA_A_abspos_s1
  #   seed: 1
  #   use_absolute_pos: true
  #   grad_checkpoint: false
  #   append_time_feature: false

  # Stage B: + gradient checkpoint (mostly a memory test — should not change accuracy)
  # - exp_name: TA_B_abspos_ckpt_s1
  #   seed: 1
  #   use_absolute_pos: true
  #   grad_checkpoint: true
  #   append_time_feature: false

  # Stage C: + time-since-start (normalized cumsum-dt scalar)
  # - exp_name: TA_C_abspos_ckpt_time_s1
  #   seed: 1
  #   use_absolute_pos: true
  #   grad_checkpoint: true
  #   append_time_feature: true

  # Stage D: + pulse_cumsum_sqrt feature (the winning GRU feature, now ported). Window still 64.
  - exp_name: TA_D_pulse_s1
    seed: 1
    use_absolute_pos: true
    grad_checkpoint: true
    append_time_feature: true
    u_transform: pulse_cumsum_sqrt

  # Stage E: D + FULL-sequence attention (context_len=512 > seq). Both fixes together. RUN ON BOX.
  - exp_name: TA_E_pulse_full_s1
    seed: 1
    use_absolute_pos: true
    grad_checkpoint: true
    append_time_feature: true
    u_transform: pulse_cumsum_sqrt
    context_len: 512

  # Stage F: full-window WITHOUT pulse (cumsum_sqrt) — isolates window vs feature. RUN ON BOX.
  - exp_name: TA_F_cumsum_full_s1
    seed: 1
    use_absolute_pos: true
    grad_checkpoint: true
    append_time_feature: true
    u_transform: cumsum_sqrt
    context_len: 512

  # Stage G: RAW-BOLUS-ONLY + full window (u_transform=sqrt = pulse only, NO cumsum). This is the
  # "full-trajectory attention reconstructs the recipe by attending to the raw bolus token, so we
  # don't need cumsum" hypothesis, tested directly. Prediction: still risks mRNA collapse (the
  # bolus-retrieval circuit must be learned against the mean-θ attractor with no persistent signal
  # to fall back on), but this is the clean test. RUN ON BOX.
  - exp_name: TA_G_pulseonly_full_s1
    seed: 1
    use_absolute_pos: true
    grad_checkpoint: true
    append_time_feature: true
    u_transform: sqrt
    context_len: 512

  # Stage H: G + mRNA-channel UPWEIGHT (rescue). If pulse-only+full-window collapses (mm pins at
  # 3.0086), this stops the model from abandoning mRNA — forcing gradient through the
  # bolus -> v_TX -> mRNA path so attention has a reason to LEARN to retrieve the raw bolus token.
  # If mRNA recovers AND protein holds, full-trajectory attention reconstructs the recipe without
  # cumsum (your hypothesis vindicated). If it still collapses, the GRU's carry-forward bias is what
  # makes the bolus usable. species_weights ch3=mRNA (heavy), ch5=protein. RUN ON BOX.
  - exp_name: TA_H_pulseonly_full_mmup_s1
    seed: 1
    use_absolute_pos: true
    grad_checkpoint: true
    append_time_feature: true
    u_transform: sqrt
    context_len: 512
    species_weights: {3: 3.0, 5: 1.0}
