# Combined-data followup for M3/M4/M5/M9v3b — DO NOT LAUNCH UNTIL
# FINAL_dense_theta_seeds.yaml (Block 1) has landed and you've confirmed:
#   - M9v3b_real R²(p)[new] is positive (not -0.17 like the pre-fix runs)
#   - M3/M4/M5/M7/M8 numbers look sane
#
# If Block 1 reveals the new-upweight didn't fix the new-data problem, this
# file's combined runs will inherit the same pathology and waste compute.
#
# Recipe: same d-recipe + new-upweight + synth-downweight as Block 1.
# Synth weight here is 0.05 for every scaffold (M3/M4/M5/M9 are not synth-
# designed — M7/M8 already covered as A/B in the dense sweep).
#
# Launch (only after Block 1 results look good):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_dense_combined_followup.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments
# Outputs: experiments_final/experiments/FINAL_dense_combined_followup/

study: FINAL_dense_combined_followup
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_m9_comb: &m9ox_comb
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11, 13]
  n_substeps: 1
  oxygen_protein_channel: 5
  oxygen_u_open_name: "u_open"

fixed:
  # training setup
  epochs: 100
  warmup_epochs: 5
  hidden: 600
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  y0_theta_init: false
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5

  # combined dataset
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  test_real_only: true
  balance_source_sampler: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # d-recipe loss
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

  # source weights
  source_loss_weights:
    new: 5.0
    old: 1.0
    synth: 0.05

runs:
  - {exp_name: M3_comb_s0,    scaffold: txtl_model3_two_state,            seed: 0, n_substeps: 1}
  - {exp_name: M4_comb_s0,    scaffold: txtl_model4_three_state,          seed: 0, n_substeps: 1}
  - {exp_name: M5_comb_s0,    scaffold: txtl_resource_and_maturation_dna, seed: 0, n_substeps: 1}
  - exp_name: M9v3b_comb_s0
    scaffold: txtl_model9_o2b
    seed: 0
    <<: *m9ox_comb
