# M7 (TXTLModel7_BoundaryGatedScaffold) full 100-epoch run.
#
# Smoke test (5 ep, 2 seeds) passed on txtl_combined real-only (312 samples).
# This spec uses txtl_native_old_only (691 real samples) — same dataset as the
# main ladder — so results are directly comparable to M3-M5 baselines.
# K bounds fixed: K_T7..K_K theta_hi 1e2 → 1.0 (see scaffolds.py commit).
# Pilot (txtl_m7_m8_pilot.yaml) should confirm convergence before running this.

study: txtl_m7_full
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 100
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  scaffold: txtl_model7_boundary_gated
  dataset_path: datasets/cell-free/txtl_native_old_only.npz
  val_n: 87
  test_n: 87
  stratify_z_expr: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: false
  encoder_use_log_dt: true
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  ckpt_every: 0

runs:
  - {exp_name: M7_s0, seed: 0}
  - {exp_name: M7_s1, seed: 1}
  - {exp_name: M7_s2, seed: 2}
