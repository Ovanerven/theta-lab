# Feature × new-upweight interaction — the decisive follow-up.
#
# FINDING (FINAL_m4_uinput_features, all {new:5}):
#   pulse_cumsum_sqrt → pm_new 0.266→0.536 (BEST new ever) but pm_old 0.759→0.204 (collapse).
# MECHANISM: features UNLOCK new (recipe now persists, so new becomes highly learnable).
#   The stale {new:5} weight — tuned when new was unfittable — then makes the optimizer
#   over-invest in the now-easy new, starving old's high-yield endpoints. {new:5} was
#   harmless when new was a lost cause; with features it's harmful.
# HYPOTHESIS: features carry new on their own, so LOWER the new-upweight → new stays good,
#   old recovers. Expect ~{new:1-2}+features to lift BOTH subsets.
#
# Sweep the two best features × {new: 1, 2, 3}. Baseline references already exist:
#   M4sq_07 (sqrt, {new:5}): pm 0.663 / old 0.759 / new 0.266
#   M4_uf_pulse_cumsum_s0 (pulse, {new:5}): pm 0.300 / old 0.204 / new 0.536
# Read each with scripts/diag_failures.py; watch pm_old recovering while pm_new holds.
#
# Launch (GPU):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_m4_feature_upweight.yaml \
#     --out-root experiments_final/experiments

study: FINAL_m4_feature_upweight
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  # ── identical to M4sq_07 / FINAL_m4_uinput_features training setup ──
  epochs: 100
  warmup_epochs: 5
  hidden: 400
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  n_substeps: 1
  y0_theta_init: false
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5
  dropout: 0.2
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # d-recipe loss
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  endpoint_loss_space: log
  lambda_peak: 0.0
  peak_channels: null
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

runs:
  # ── pulse_cumsum × new-upweight ──
  - {exp_name: M4_fw_pulse_new1_s0, seed: 0, u_transform: pulse_cumsum_sqrt, source_loss_weights: {new: 1.0, old: 1.0}}
  - {exp_name: M4_fw_pulse_new2_s0, seed: 0, u_transform: pulse_cumsum_sqrt, source_loss_weights: {new: 2.0, old: 1.0}}
  - {exp_name: M4_fw_pulse_new3_s0, seed: 0, u_transform: pulse_cumsum_sqrt, source_loss_weights: {new: 3.0, old: 1.0}}

  # ── cumsum × new-upweight (plain persistence, for contrast) ──
  - {exp_name: M4_fw_cumsum_new1_s0, seed: 0, u_transform: cumsum_sqrt, source_loss_weights: {new: 1.0, old: 1.0}}
  - {exp_name: M4_fw_cumsum_new2_s0, seed: 0, u_transform: cumsum_sqrt, source_loss_weights: {new: 2.0, old: 1.0}}
