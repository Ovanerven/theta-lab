# Transformer decay_trace SEED EXTENSION — pure repeats of the TI_decay config.
#
# Why: the decay_trace winner (TI_decay_s0 = protein 0.399 / mRNA 0.555) has 4 seeds so
# far — s0 (in FINAL_coarse_transformer_inputs) and s1,s2,s3 (TR_decay_* in
# FINAL_coarse_transformer_decay_replicate). PROTEIN is stable across them (~0.40) but
# mRNA is NOT: s0=0.555 while s1-s3 collapse to ~-0.47. The good mRNA is currently a
# single-seed fluke. This sweep adds 5 FRESH seeds (4-8) of the IDENTICAL config so the
# decay arm reaches n=9 and we can state a real mean+-std for both protein and mRNA.
#
# Fixed block copied VERBATIM from FINAL_coarse_transformer_decay_replicate.yaml
# (h400, default tau, decay_trace, transformer_final_norm=true). Only the seed varies,
# so these sit directly next to the existing s0-s3 runs.
#
# 5 arms, 1 seed each, ~3.3 h each serialized ~= 17 h wall.
#
# Launch (GPU box, serialized):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_transformer_decay_seeds.yaml --local --max-parallel 1

study: FINAL_coarse_transformer_decay_seeds
runs_per_job: 1
time: "02:00:00"
partition: gpu_h100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  scaffold: txtl_model4_three_state
  hidden: 400
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: decay_trace
  lmu_memory: 64
  lmu_theta: 324
  y_transform: sqrt_clamp1
  d_state: 16
  expand: 2
  d_conv: 4
  context_len: 384
  tf_group_size: 32
  ar_gap: 4
  ff_mult: 2
  autocast_bf16: true
  jit_scripting: false
  model_class: ode_transformer
  transformer_final_norm: true
  grad_checkpoint: true
  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # ── fresh seeds 4-8 of the exact TI_decay config (s0-s3 already exist elsewhere) ──
  - {exp_name: TR_decay_s4, seed: 4, u_transform: decay_trace}
  - {exp_name: TR_decay_s5, seed: 5, u_transform: decay_trace}
  - {exp_name: TR_decay_s6, seed: 6, u_transform: decay_trace}
  - {exp_name: TR_decay_s7, seed: 7, u_transform: decay_trace}
  - {exp_name: TR_decay_s8, seed: 8, u_transform: decay_trace}
