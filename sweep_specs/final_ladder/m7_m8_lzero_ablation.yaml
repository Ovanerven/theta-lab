# L_zero (lambda_zero_traj) ablation — 2 runs, ~1h total.
#
# Question: does M7's tex-defined boundary loss actually contribute on top
# of bg_fixed's per-reagent background offset? And does extending it to M8
# (not in the tex) help?
#
# Each row mirrors the canonical M7_bg_boundary / M8_bg_boundary s0 config
# EXACTLY except for lambda_zero_traj=0.
#
# Comparison values (same config + lambda_zero_traj=0.005):
#   M7_bg_boundary s0 → R²p=0.4798, R²m=0.4774
#   M8_bg_boundary s0 → in progress
#
# Outcome interpretation:
#   ΔR²p < 0.02 on both     → drop L_zero from M7 AND M8 (bg_fixed alone is enough)
#   M7 helps, M8 doesn't    → keep L_zero on M7 only (tex-faithful)
#   both help               → keep L_zero on both (tex-extension to M8)
#
# Launch:
#   python launch_sweep.py sweep_specs/final_ladder/m7_m8_lzero_ablation.yaml --local --max-parallel 1

study: m7_m8_lzero_ablation
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_comb_loss: &comb
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

fixed:
  epochs: 100
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  val_n: 125
  test_n: 125
  stratify_z_expr: false
  test_real_only: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  balance_source_sampler: true
  source_loss_weights: null     # no synth downweight (mirror canonical M7_bg_boundary s0)
  lambda_zero_traj: 0.0         # ← the ablation: L_zero OFF
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5
  ckpt_every: 0
  y0_theta_init: false
  model_class: ode_rnn
  <<: *comb

runs:
  - exp_name: M7_bg_boundary_noLzero_s0
    scaffold: txtl_model7_bg_fixed
    seed: 0
    n_substeps: 1

  - exp_name: M8_bg_boundary_noLzero_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_substeps: 2
