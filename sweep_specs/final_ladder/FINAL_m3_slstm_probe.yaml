# M3+sLSTM probe (Mac mini) — chase the best-ever overall R² outlier (pm 0.680 native).
# ALL COARSE (no native runs — too slow on the mini). M3 two-state + sLSTM, original
# between-layers dropout (slstm_drop_last_layer false, = the 0.680 run), 100 epochs.
#
#   1. coarse + the 0.680 run's recipe (d-recipe, {new:5}, sqrt, h600) → M3+sLSTM baseline on coarse
#   2. + GRU-optimal recipe (HY loss, {new:1}, cumsum_sqrt, nsub3) → grafts the coarse-GRU wins
#   3. + smaller hidden (h300) → the GRU's best-hidden finding
#   4. + more substeps (nsub5) → push the integration win
#
# (Native recreation of 0.680 deferred to the GPU box; see memory project_m3_slstm_outlier.)
#
# Launch (Mac mini):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_m3_slstm_probe.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_m3_slstm_probe
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  # ── exact M3+sLSTM recreation defaults (native, d-recipe, {new:5}, sqrt, h600, 100ep) ──
  epochs: 100
  warmup_epochs: 5
  lr: 0.002
  weight_decay: 0.0018
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_slstm
  scaffold: txtl_model3_two_state
  hidden: 600
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 1
  slstm_drop_last_layer: false       # original between-layers dropout (= the 0.680 run)
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  forget_bias_init: null
  y0_theta_init: false
  encoder_use_log_dt: true
  plot_extra_new_samples: 3
  u_transform: sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # d-recipe (the 0.680 run's loss)
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 5.0, old: 1.0}

runs:
  # 1. coarse + the 0.680 run's recipe (d-recipe, {new:5}, sqrt, h600) — M3+sLSTM baseline on coarse
  - {exp_name: M3sl_coarse_sameRecipe_s0, seed: 0}

  # 2. + GRU-optimal recipe: HY loss + {new:1} + cumsum_sqrt + nsub3
  - exp_name: M3sl_coarse_gruopt_s0
    seed: 0
    u_transform: cumsum_sqrt
    n_substeps: 3
    source_loss_weights: {new: 1.0, old: 1.0}
    time_upweight: null
    endpoint_channels: null
    lambda_endpoint: 0.0

  # 3. + smaller hidden (h300), else same as 2
  - exp_name: M3sl_coarse_gruopt_h300_s0
    seed: 0
    hidden: 300
    u_transform: cumsum_sqrt
    n_substeps: 3
    source_loss_weights: {new: 1.0, old: 1.0}
    time_upweight: null
    endpoint_channels: null
    lambda_endpoint: 0.0

  # 4. + more substeps (nsub5), h600
  - exp_name: M3sl_coarse_gruopt_nsub5_s0
    seed: 0
    u_transform: cumsum_sqrt
    n_substeps: 5
    source_loss_weights: {new: 1.0, old: 1.0}
    time_upweight: null
    endpoint_channels: null
    lambda_endpoint: 0.0
