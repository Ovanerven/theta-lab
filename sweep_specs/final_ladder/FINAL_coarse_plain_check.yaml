# Tiny add-on: the winning config (M4 h300 nsub3 pulse coarse {new:1}) at PLAIN loss, 3 seeds.
# Complements FINAL_coarse_seed_combo (which is all HY) — settles HY-vs-plain at the optimum.
# Loss decomposition favored plain on protein (0.632 vs HY 0.592) but we never tested plain
# at the winning hparams. plain = no species-weight, no time_upweight, no endpoint anchor.
#
# Launch (GPU or mini — 3 fast coarse runs):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_plain_check.yaml \
#     --out-root experiments_final/experiments --max-parallel 3

study: FINAL_coarse_plain_check
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: stacked_cell
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  # PLAIN loss: no species-weight, no time_upweight, no endpoint anchor.
  use_ivtt_mse_loss: false
  species_weights: null
  time_upweight: null
  endpoint_channels: null
  lambda_endpoint: 0.0
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # stacked_cell + plain (default variant)
  - {exp_name: S_M4h300_nsub3_PLAIN_s0, seed: 0}
  - {exp_name: S_M4h300_nsub3_PLAIN_s1, seed: 1}
  - {exp_name: S_M4h300_nsub3_PLAIN_s2, seed: 2}

  # nn_gru + plain — nn_gru had the BEST OLD (0.726) in the scan but was never combined
  # with h300/nsub3 or tested on plain. Completes the variant×loss square at the winning hparams.
  - {exp_name: S_M4h300_nsub3_nngru_PLAIN_s0, seed: 0, gru_variant: nn_gru}
  - {exp_name: S_M4h300_nsub3_nngru_PLAIN_s1, seed: 1, gru_variant: nn_gru}
  - {exp_name: S_M4h300_nsub3_nngru_PLAIN_s2, seed: 2, gru_variant: nn_gru}
