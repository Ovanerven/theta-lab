# M7_bg / M8_bg sparse-K sweep — Bob's machine
#
# Fills the gap left by v3's broken M7/M8 scaffolds.
# NO overlap with sparse_k_real_then_comb (Mac Mini), which covers M7_fixed and
# M8_fixed sparse-K. This sweep covers M7_bg_fixed and M8_bg_fixed sparse-K.
#
# v3 runs being replaced:
#   M7_K1/K3/K6_s0  — txtl_model7_boundary_gated (broken, zero-gate collapse)
#   M8_K1/K3/K6_real_s0 — txtl_model8_reagent_resource (broken, same cause)
#
# sparse_k_real_then_comb (Mac Mini) covers:
#   M3/M4/M5/M7_fixed/M8_fixed/M9 × K=1,3,6 × real_only + combined
#   → do NOT add those here.
#
# Run on Bob's machine:
#   python launch_sweep.py sweep_specs/final_ladder/m7_m8_bg_sparse_k.yaml --local --max-parallel 2

study: m7_m8_bg_sparse_k
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

_comb_loss: &comb
  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

_real_only_overrides: &real
  dataset_path: datasets/cell-free/txtl_native_real_only.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false

fixed:
  epochs: 100
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 5
  hidden: 600
  dataset_path: datasets/cell-free/txtl_native_combined.npz
  use_synthetic_data: true
  val_n: 125
  test_n: 125
  stratify_z_expr: false
  test_real_only: true
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  balance_source_sampler: true
  source_loss_weights: {synth: 0.05}
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  plot_extra_new_samples: 5
  ckpt_every: 0
  y0_theta_init: false
  model_class: ode_rnn_sparse_theta_v2
  anchor_mode: uniform
  <<: *comb

runs:
  # ─── M7_bg sparse-K, real_only ──────────────────────────────────────────────
  - {exp_name: M7_bg_K1_real_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 1, n_substeps: 1, <<: *real}
  - {exp_name: M7_bg_K3_real_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 3, n_substeps: 1, <<: *real}
  - {exp_name: M7_bg_K6_real_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 6, n_substeps: 1, <<: *real}

  # ─── M7_bg sparse-K, combined ───────────────────────────────────────────────
  - {exp_name: M7_bg_K1_comb_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 1, n_substeps: 1}
  - {exp_name: M7_bg_K3_comb_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 3, n_substeps: 1}
  - {exp_name: M7_bg_K6_comb_s0, scaffold: txtl_model7_bg_fixed, seed: 0, n_theta_anchors: 6, n_substeps: 1}

  # ─── M8_bg sparse-K, real_only ──────────────────────────────────────────────
  - exp_name: M8_bg_K1_real_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 1
    n_substeps: 2
    <<: *real
  - exp_name: M8_bg_K3_real_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 3
    n_substeps: 2
    <<: *real
  - exp_name: M8_bg_K6_real_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 6
    n_substeps: 2
    <<: *real

  # ─── M8_bg sparse-K, combined ───────────────────────────────────────────────
  - exp_name: M8_bg_K1_comb_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 1
    n_substeps: 2
  - exp_name: M8_bg_K3_comb_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 3
    n_substeps: 2
  - exp_name: M8_bg_K6_comb_s0
    scaffold: txtl_model8_bg_fixed
    seed: 0
    n_theta_anchors: 6
    n_substeps: 2
