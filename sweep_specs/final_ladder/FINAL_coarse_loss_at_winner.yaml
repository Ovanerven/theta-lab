# Re-test the FULL loss decomposition at the WINNING config (h300, nsub3) — not h400/nsub1.
# The "loss engineering doesn't help old" conclusion was drawn at h400/nsub1, before we found
# h300/nsub3. plain & HY at h300/nsub3 are already covered (plain_check + seed_combo/square);
# this adds the fully-engineered end (d-recipe, HY2) so the 4-point decomposition is complete
# AT the winner. Anchor: M4 / h300 / nsub3 / pulse / coarse / {new:1} / 200ep. Seeded.
#
# Together with plain_check (plain) + seed_combo (HY): plain/HY/HY2/d-recipe at h300/nsub3, ×3.
#
# Launch (mac mini / laptop):
#   python launch_sweep.py sweep_specs/final_ladder/FINAL_coarse_loss_at_winner.yaml \
#     --local --max-parallel 1 --out-root experiments_final/experiments

study: FINAL_coarse_loss_at_winner
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: stacked_cell
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  use_ivtt_mse_loss: false
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # d-recipe (full engineering: species + late-protein + endpoint anchor)
  - {exp_name: LW_drecipe_s0, seed: 0, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5]}
  - {exp_name: LW_drecipe_s1, seed: 1, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5]}
  - {exp_name: LW_drecipe_s2, seed: 2, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.1, endpoint_channels: [5]}

  # HY2 (species + late-protein, NO endpoint anchor)
  - {exp_name: LW_HY2_s0, seed: 0, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}
  - {exp_name: LW_HY2_s1, seed: 1, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}
  - {exp_name: LW_HY2_s2, seed: 2, species_weights: {3: 1.25, 5: 1.0}, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}

  # lateP-only (ONLY second-half protein upweight: NO mRNA species-weight, NO endpoint anchor)
  - {exp_name: LW_lateP_s0, seed: 0, species_weights: null, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}
  - {exp_name: LW_lateP_s1, seed: 1, species_weights: null, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}
  - {exp_name: LW_lateP_s2, seed: 2, species_weights: null, time_upweight: {5: [0.5, 3.0]}, lambda_endpoint: 0.0, endpoint_channels: null}
