  #   model_class: ode_slstm
  #   lambda_zero_traj: 0.005
  #   source_loss_weights: {new: 5.0, old: 1.0, synth: 1.0}
  # - exp_name: M9_dark_real_full_slstm_s0
  #   scaffold: txtl_model9_dark_stable
