# M4 sweep for the Mac mini — idea #1 (stage-evaluated neural residual g(y)) and
# idea #3 (theta-smoothness L2 penalty), 3 seeds each = 6 runs.
#
# base_config + fixed: are COPIED VERBATIM from
#   sweep_specs/final_ladder/FINAL_coarse_nngru_finalize.yaml
# and every run carries NG_plain's exact plain-loss keys, so the config at launch
# is identical to the NG_plain baseline runs — each run here differs only by the
# toggled flag (l2_regularization / rk4_residual). Compare against the existing
# baseline: experiments_final/FINAL_coarse_nngru_finalize/NG_plain_s{0,1,2}.
#
# Launch (mac mini):
#   source .venv/bin/activate
#   python launch_sweep.py sweep_specs/m4_mac_sweep.yaml --local --dry-run
#   python launch_sweep.py sweep_specs/m4_mac_sweep.yaml --local --max-parallel 1

study: m4_mac_sweep
runs_per_job: 1
time: "02:00:00"
partition: gpu_a100
no_plot: false
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 200
  warmup_epochs: 5
  lr: 0.002
  endpoint_r2: true
  ckpt_every: 0
  obs_idx: [3, 5]
  gru_u_cols: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]
  gru_y_cols: [3, 5]
  val_n: 125
  test_n: 125
  model_class: ode_rnn
  scaffold: txtl_model4_three_state
  hidden: 300
  num_layers: 2
  lift_dim: 32
  dropout: 0.2
  n_substeps: 3
  gru_variant: nn_gru            # the best-old / balanced variant
  gru_init: supervisor
  head_init: supervisor
  lift_skip: true
  theta_head_tau: 2.3
  y0_theta_init: false
  encoder_use_log_dt: true
  u_transform: pulse_cumsum_sqrt
  y_transform: sqrt_clamp1

  dataset_path: datasets/cell-free/txtl_native_real_only_coarsenold.npz
  use_synthetic_data: false
  balance_source_sampler: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  stratify_z_expr: false
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]

  use_ivtt_mse_loss: false
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0
  source_loss_weights: {new: 1.0, old: 1.0}

runs:
  # idea #3: theta-smoothness L2 penalty  (plain loss = NG_plain, + l2_regularization)
  - {exp_name: l2pen_s0, seed: 0, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, l2_regularization: true, lambda_reg: 0.001}
  - {exp_name: l2pen_s1, seed: 1, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, l2_regularization: true, lambda_reg: 0.001}
  - {exp_name: l2pen_s2, seed: 2, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, l2_regularization: true, lambda_reg: 0.001}

  # idea #1: stage-evaluated neural residual g(y)  (plain loss = NG_plain, + rk4_residual)
  - {exp_name: rk4resid_s0, seed: 0, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, rk4_residual: true, rk4_residual_hidden: 64, rk4_residual_layers: 2}
  - {exp_name: rk4resid_s1, seed: 1, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, rk4_residual: true, rk4_residual_hidden: 64, rk4_residual_layers: 2}
  - {exp_name: rk4resid_s2, seed: 2, species_weights: null, time_upweight: null, endpoint_channels: null, lambda_endpoint: 0.0, rk4_residual: true, rk4_residual_hidden: 64, rk4_residual_layers: 2}
