# Architecture sweep for glycolysis_reduced12 at n=1000.
# Active: 3 architectures (LSTM, Mamba, Transformer) × seed 42 × 2 obs settings = 6 runs.
#   d_y = n^x = 12  (full obs, no obs_idx)
#   d_y = 2         (first_last, obs_idx: [0, 11])
# GRU runs and seeds {0,1} are commented out (GRU comes from existing data-ablation sweep).

study: glycolysis_reduced12_arch_sweep_n1000
runs_per_job: 1
time: "08:00:00"
partition: gpu_h100
no_plot: false

fixed:
  scaffold: glycolysis_reduced12
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  epochs: 100
  batch_size: 32

runs:
  # ── d_y = n^x (full obs) ──────────────────────────────────────────────
  # --- GRU (ode_rnn) --- already covered by data-ablation sweep; copy A6_baseline_n1000 over manually.
  # - {base_config: configs/archs/gru.yaml,         seed: 42, exp_name: gru_glyc12_n1000_s42}
  # --- LSTM ---
  - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_glyc12_n1000_s42}
  # --- Mamba ---
  - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_glyc12_n1000_s42, env: mamba_env}
  # --- Transformer ---
  - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_glyc12_n1000_s42}

  # ── d_y = 2 (first_last, obs_idx: [0, 11]) ────────────────────────────
  # --- GRU (ode_rnn) --- already covered by data-ablation sweep; copy A6_baseline_first_last_n1000 over manually.
  # - {base_config: configs/archs/gru.yaml,         seed: 42, exp_name: gru_glyc12_n1000_fl_s42, obs_idx: [0, 11]}
  # --- LSTM ---
  - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_glyc12_n1000_fl_s42, obs_idx: [0, 11]}
  # --- Mamba ---
  - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_glyc12_n1000_fl_s42, env: mamba_env, obs_idx: [0, 11]}
  # --- Transformer ---
  - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_glyc12_n1000_fl_s42, obs_idx: [0, 11]}
