# Architecture sweep for single_enzyme_lumped at n100.
# sLSTM-only re-run: lands in existing study folder alongside lstm/mamba/trans results.
# NOTE: single_enzyme_lumped has only 2 species, so d_y = n^x = 2 already coincides with first_last.

study: single_enzyme_lumped_arch_sweep
runs_per_job: 1
time: "08:00:00"
partition: gpu_a100
no_plot: false

fixed:
  scaffold: single_enzyme_lumped
  dataset_path: datasets/single_enzyme/single_enzyme_lumped_n100.npz
  val_n: 10
  test_n: 10
  epochs: 100
  batch_size: 32

runs:
  # - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_enzlumped_n100_s42}
  # - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_enzlumped_n100_s42, env: mamba_env}
  # - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_enzlumped_n100_s42}
  - {base_config: configs/archs/slstm.yaml,       seed: 42, exp_name: slstm_enzlumped_n100_s42}
