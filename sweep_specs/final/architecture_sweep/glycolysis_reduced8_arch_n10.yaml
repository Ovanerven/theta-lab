# Architecture sweep for glycolysis_reduced8 at n10.
# sLSTM-only re-run: lands in existing study folder alongside lstm/mamba/trans results.

study: glycolysis_reduced8_arch_sweep_n10
runs_per_job: 1
time: "08:00:00"
partition: gpu_a100
no_plot: false

fixed:
  scaffold: glycolysis_reduced8
  dataset_path: datasets/glycolysis/glycolysis_reduced8_n10.npz
  val_n: 1
  test_n: 1
  epochs: 100
  batch_size: 32

runs:
  # ── d_y = n^x (full obs) ──────────────────────────────────────────────
  # - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_glyc8_n10_s42}
  # - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_glyc8_n10_s42, env: mamba_env}
  # - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_glyc8_n10_s42}
  - {base_config: configs/archs/slstm.yaml,       seed: 42, exp_name: slstm_glyc8_n10_s42}

  # ── d_y = 2 (first_last, obs_idx: [0, 7]) ──────────────────────────
  # - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_glyc8_n10_fl_s42, obs_idx: [0, 7]}
  # - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_glyc8_n10_fl_s42, env: mamba_env, obs_idx: [0, 7]}
  # - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_glyc8_n10_fl_s42, obs_idx: [0, 7]}
  - {base_config: configs/archs/slstm.yaml,       seed: 42, exp_name: slstm_glyc8_n10_fl_s42, obs_idx: [0, 7]}
