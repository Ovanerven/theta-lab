# Architecture sweep for mof_synthesis_6 at n10.
# sLSTM-only re-run: lands in existing study folder alongside lstm/mamba/trans results.

study: mof_synthesis_6_arch_sweep_n10
runs_per_job: 1
time: "08:00:00"
partition: gpu_a100
no_plot: false

fixed:
  scaffold: mof_synthesis_6
  dataset_path: datasets/mof/mof_synthesis_6_n10.npz
  val_n: 1
  test_n: 1
  epochs: 100
  batch_size: 32

runs:
  # ── d_y = n^x (full obs) ──────────────────────────────────────────────
  # - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_mof6_n10_s42}
  # - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_mof6_n10_s42, env: mamba_env}
  # - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_mof6_n10_s42}
  - {base_config: configs/archs/slstm.yaml,       seed: 42, exp_name: slstm_mof6_n10_s42}

  # ── d_y = 2 (first_last, obs_idx: [0, 5]) ──────────────────────────
  # - {base_config: configs/archs/lstm.yaml,        seed: 42, exp_name: lstm_mof6_n10_fl_s42, obs_idx: [0, 5]}
  # - {base_config: configs/archs/mamba.yaml,       seed: 42, exp_name: mamba_mof6_n10_fl_s42, env: mamba_env, obs_idx: [0, 5]}
  # - {base_config: configs/archs/transformer.yaml, seed: 42, exp_name: trans_mof6_n10_fl_s42, obs_idx: [0, 5]}
  - {base_config: configs/archs/slstm.yaml,       seed: 42, exp_name: slstm_mof6_n10_fl_s42, obs_idx: [0, 5]}
