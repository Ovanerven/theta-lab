  - {model_class: neural_ode_gru, exp_name: A3_neural_ode_gru_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, obs_idx: [0, 11]}
  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1}
  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, obs_idx: [0, 11]}
  - {model_class: ode_rnn, exp_name: A5_unbounded_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, theta_bounded: false}
  - {model_class: ode_rnn, exp_name: A5_unbounded_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, theta_bounded: false, obs_idx: [0, 11]}
  - {model_class: ode_rnn, exp_name: A6_baseline_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1}
  - {model_class: ode_rnn, exp_name: A6_baseline_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, obs_idx: [0, 11]}
  - {model_class: ode_rnn, exp_name: A7_l1reg_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, l1_regularization: true, lambda_reg: 0.1}
  - {model_class: ode_rnn, exp_name: A7_l1reg_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, l1_regularization: true, lambda_reg: 0.1, obs_idx: [0, 11]}
  - {model_class: neural_ode_correction, exp_name: A9_neural_ode_correction_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1}
  - {model_class: neural_ode_correction, exp_name: A9_neural_ode_correction_first_last_n10, dataset_path: datasets/glycolysis/glycolysis_reduced12_n10.npz, val_n: 1, test_n: 1, obs_idx: [0, 11]}

  # ── N=3  (val_n=1, test_n=1) ──
  - {model_class: ode_fixed_theta, exp_name: A1_fixed_theta_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1}
  - {model_class: ode_sample_theta, exp_name: A2_sample_theta_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1}
