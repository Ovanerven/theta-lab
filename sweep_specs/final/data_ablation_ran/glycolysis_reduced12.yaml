  - {model_class: ode_rnn, exp_name: A7_l1reg_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1, l1_regularization: true, lambda_reg: 0.1}
  - {model_class: ode_rnn, exp_name: A7_l1reg_first_last_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1, l1_regularization: true, lambda_reg: 0.1, obs_idx: [0, 11]}
  - {model_class: neural_ode_correction, exp_name: A9_neural_ode_correction_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1}
