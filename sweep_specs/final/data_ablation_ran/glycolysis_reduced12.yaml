  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1}
  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_first_last_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1, obs_idx: [0, 11]}
  - {model_class: ode_rnn, exp_name: A5_unbounded_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1, theta_bounded: false}
  - {model_class: ode_rnn, exp_name: A5_unbounded_first_last_n3, dataset_path: datasets/glycolysis/glycolysis_reduced12_n3.npz, val_n: 1, test_n: 1, theta_bounded: false, obs_idx: [0, 11]}
