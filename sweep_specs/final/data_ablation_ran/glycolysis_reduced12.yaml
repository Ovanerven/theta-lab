# Data ablation for glycolysis_reduced12.
# Sweep all ablation variants (A1..A9) at N in {1000,100,10,3}.
# Splits: train=80% / val=10% / test=10% of N (clamped to ≥1 each).

study: glycolysis_reduced12_data_ablation
runs_per_job: 4
time: "01:30:00"
partition: gpu_a100
no_plot: false

fixed:
  base_config: configs/glycolisis/glycolisis.yaml
  scaffold: glycolysis_reduced12
  epochs: 100

runs:
  # ── N=1000  (val_n=100, test_n=100) ──
  # - {model_class: ode_fixed_theta, exp_name: A1_fixed_theta_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: ode_sample_theta, exp_name: A2_sample_theta_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: neural_ode_gru, exp_name: A3_neural_ode_gru_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: neural_ode_gru, exp_name: A3_neural_ode_gru_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, obs_idx: [0, 11]}
  # - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, obs_idx: [0, 11]}
  # - {model_class: ode_rnn, exp_name: A5_unbounded_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, theta_bounded: false}
  # - {model_class: ode_rnn, exp_name: A5_unbounded_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, theta_bounded: false, obs_idx: [0, 11]}
  # - {model_class: ode_rnn, exp_name: A6_baseline_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: ode_rnn, exp_name: A6_baseline_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, obs_idx: [0, 11]}
  # - {model_class: ode_rnn, exp_name: A7_l1reg_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, l1_regularization: true, lambda_reg: 0.1}
  # - {model_class: ode_rnn, exp_name: A7_l1reg_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, l1_regularization: true, lambda_reg: 0.1, obs_idx: [0, 11]}
  # - {model_class: neural_ode_correction, exp_name: A9_neural_ode_correction_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100}
  # - {model_class: neural_ode_correction, exp_name: A9_neural_ode_correction_first_last_n1000, dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz, val_n: 100, test_n: 100, obs_idx: [0, 11]}

  # ── N=100  (val_n=10, test_n=10) ──
  - {model_class: ode_fixed_theta, exp_name: A1_fixed_theta_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10}
  - {model_class: ode_sample_theta, exp_name: A2_sample_theta_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10}
  - {model_class: neural_ode_gru, exp_name: A3_neural_ode_gru_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10}
  - {model_class: neural_ode_gru, exp_name: A3_neural_ode_gru_first_last_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10, obs_idx: [0, 11]}
  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10}
  - {model_class: neural_ode_mlp, exp_name: A4_neural_ode_mlp_first_last_n100, dataset_path: datasets/glycolysis/glycolysis_reduced12_n100.npz, val_n: 10, test_n: 10, obs_idx: [0, 11]}
