study: mof_synthesis_4_data_ablation
runs_per_job: 1
time: 04:00:00
partition: gpu_a100
no_plot: false
fixed:
  base_config: configs/archs/gru_optimal.yaml
  scaffold: mof_synthesis_4
  epochs: 100
runs:
- model_class: neural_ode_mlp
  exp_name: A4_neural_ode_mlp_first_last_n1000
  dataset_path: datasets/mof/mof_synthesis_4_n1000.npz
  val_n: 100
  test_n: 100
  obs_idx:
  - 0
  - 3
- model_class: ode_rnn
  exp_name: A5_unbounded_first_last_n1000
  dataset_path: datasets/mof/mof_synthesis_4_n1000.npz
  val_n: 100
  test_n: 100
  theta_bounded: false
  obs_idx:
  - 0
  - 3
- model_class: ode_rnn
  exp_name: A6_baseline_first_last_n1000
  dataset_path: datasets/mof/mof_synthesis_4_n1000.npz
  val_n: 100
  test_n: 100
  obs_idx:
  - 0
  - 3
- model_class: ode_rnn
  exp_name: A7_l1reg_first_last_n1000
  dataset_path: datasets/mof/mof_synthesis_4_n1000.npz
  val_n: 100
  test_n: 100
  l1_regularization: true
  lambda_reg: 0.1
  obs_idx:
  - 0
  - 3
- model_class: neural_ode_correction
  exp_name: A9_neural_ode_correction_first_last_n1000
  dataset_path: datasets/mof/mof_synthesis_4_n1000.npz
  val_n: 100
  test_n: 100
  obs_idx:
  - 0
  - 3
