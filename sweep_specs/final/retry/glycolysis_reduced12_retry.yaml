study: glycolysis_reduced12_data_ablation
runs_per_job: 1
time: 04:00:00
partition: gpu_mig
no_plot: false
fixed:
  base_config: configs/glycolisis/glycolisis.yaml
  scaffold: glycolysis_reduced12
  epochs: 100
runs:
- model_class: ode_fixed_theta
  exp_name: A1_fixed_theta_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
- model_class: ode_rnn
  exp_name: A5_unbounded_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  theta_bounded: false
- model_class: ode_rnn
  exp_name: A5_unbounded_first_last_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  theta_bounded: false
  obs_idx:
  - 0
  - 11
- model_class: ode_rnn
  exp_name: A6_baseline_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
- model_class: ode_rnn
  exp_name: A6_baseline_first_last_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  obs_idx:
  - 0
  - 11
- model_class: ode_rnn
  exp_name: A7_l1reg_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  l1_regularization: true
  lambda_reg: 0.1
- model_class: ode_rnn
  exp_name: A7_l1reg_first_last_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  l1_regularization: true
  lambda_reg: 0.1
  obs_idx:
  - 0
  - 11
- model_class: neural_ode_correction
  exp_name: A9_neural_ode_correction_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
- model_class: neural_ode_correction
  exp_name: A9_neural_ode_correction_first_last_n1000
  dataset_path: datasets/glycolysis/glycolysis_reduced12_n1000.npz
  val_n: 100
  test_n: 100
  obs_idx:
  - 0
  - 11
