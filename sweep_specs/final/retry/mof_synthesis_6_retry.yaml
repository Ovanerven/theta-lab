study: mof_synthesis_6_data_ablation
runs_per_job: 1
time: 04:00:00
partition: gpu_a100
no_plot: false
fixed:
  base_config: configs/archs/gru_optimal.yaml
  scaffold: mof_synthesis_6
  epochs: 100
runs:
