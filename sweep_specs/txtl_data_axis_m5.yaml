  - exp_name: A2_old_interp_drecipe_seed2
    seed: 2
    dataset_path: datasets/cell-free/txtl_legacy_in_combined.npz
    val_n: 86
    test_n: 86
    stratify_z_expr: false
    use_synthetic_data: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0
  - exp_name: A2_old_interp_drecipe_seed3
    seed: 3
    dataset_path: datasets/cell-free/txtl_legacy_in_combined.npz
    val_n: 86
    test_n: 86
    stratify_z_expr: false
    use_synthetic_data: false
    use_ivtt_mse_loss: false
    species_weights: {3: 1.25, 5: 1.0}
    time_upweight: {5: [0.5, 3.0]}
    lambda_endpoint: 0.1
    endpoint_channels: [5]
    loss_normalizer_channels: 3
    loss_clamp_min: 1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # A3 — OLD + NEW real, no synth. N≈1003 → 125.
  # ═══════════════════════════════════════════════════════════════════════════
