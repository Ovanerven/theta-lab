# Smoke test for ode_rnn_sparse_theta_v2 patches:
#   - log_dt bug fix (V2 now concats log_dt to encoder features)
#   - new anchor_mode: "uniform" | "bolus"
#   - new bolus_max_anchors cap
#
# 1 epoch per arm, single seed. Goal: verify every code path executes end-to-end
# without crashing. Don't read into the metrics — 1 epoch isn't enough to learn.

study: txtl_sparse_k_smoketest
runs_per_job: 1
time: "00:30:00"
partition: gpu_a100
no_plot: true
base_config: configs/txtl_gru_new_baseline.yaml

fixed:
  epochs: 1
  endpoint_r2: true
  obs_idx: [3, 5]
  warmup_epochs: 1
  hidden: 600
  seed: 1
  y0_theta_init: false
  dataset_path: datasets/cell-free/txtl_native_old_only.npz
  val_n: 87
  test_n: 87
  stratify_z_expr: false
  test_real_only: false
  stratified_split: true
  stratify_targets: [3, 5]
  stratify_bins: 5
  stratify_by_source: true
  subtract_channel_min: true
  subtract_channel_min_cols: [3, 5]
  encoder_use_log_dt: true               # verifies the log_dt bug fix
  plot_extra_new_samples: 0

  scaffold: txtl_resource_and_maturation_dna
  model_class: ode_rnn_sparse_theta_v2

  use_ivtt_mse_loss: false
  species_weights: {3: 1.25, 5: 1.0}
  time_upweight: {5: [0.5, 3.0]}
  lambda_endpoint: 0.1
  endpoint_channels: [5]
  loss_normalizer_channels: 3
  loss_clamp_min: 1.0

runs:
  # ─── Uniform anchor mode (existing path, with log_dt fix) ───────────────
  - {exp_name: uniform_K1,  anchor_mode: uniform, n_theta_anchors: 1}
  - {exp_name: uniform_K3,  anchor_mode: uniform, n_theta_anchors: 3}
  - {exp_name: uniform_K6,  anchor_mode: uniform, n_theta_anchors: 6}
  - {exp_name: uniform_K12, anchor_mode: uniform, n_theta_anchors: 12}
  - {exp_name: uniform_K48, anchor_mode: uniform, n_theta_anchors: 48}

  # ─── Bolus anchor mode (new code path) ──────────────────────────────────
  # n_theta_anchors is required by the config (>=1) but ignored for placement
  # in bolus mode — anchors come from u_seq events.
  - {exp_name: bolus_uncapped, anchor_mode: bolus, n_theta_anchors: 1, bolus_max_anchors: 0}
  - {exp_name: bolus_K16,      anchor_mode: bolus, n_theta_anchors: 1, bolus_max_anchors: 16}
  - {exp_name: bolus_K24,      anchor_mode: bolus, n_theta_anchors: 1, bolus_max_anchors: 24}
